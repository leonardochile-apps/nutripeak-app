const Ring = ({pct,label,sub}) => {
  const circum = 2 * Math.PI * 45;
  const strokeDash = circum * Math.min(pct, 1);
  const color = pct > 1 ? "#EF4444" : GREEN;
  return (
    <div style={{position:'relative',width:120,height:120,minWidth:120}}>
      <svg style={{width:"100%",height:"100%",transform:"rotate(-90deg)"}} viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="45" fill="none" stroke="#f0f0f0" strokeWidth="8"/>
        <circle cx="60" cy="60" r="45" fill="none" stroke={color} strokeWidth="8" 
          strokeDasharray={circum} strokeDashoffset={circum-strokeDash} strokeLinecap="round"/>
      </svg>
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
        <div style={{fontSize:20,fontWeight:700,color:GREEN}}>{label}</div>
        <div style={{fontSize:11,color:'#999'}}>{sub}</div>
      </div>
    </div>
  );
};

const MacroBar = ({label,val,max,color}) => {
  const pct = Math.min(val/max, 1)*100;
  return (

};

const WeightChart = ({data}) => {
  const chartRef = useRef(null);

  useEffect(()=>{
    if(!chartRef.current) return;
    const ctx = chartRef.current.getContext('2d');
    if(chartInstance.current) chartInstance.current.destroy();
    const validData = data.filter(v=>v!==null);
    if(validData.length===0) return;
    chartInstance.current = new Chart(ctx, {
      type:'line',
      data:{
        labels: Array.from({length:14},(_,i)=>''),

};

const calculateTMB = (weight, height, age, sex) => {
  if(sex === "M") {
    return 10 * weight + 6.25 * height - 5 * age + 5;
  } else {
    return 10 * weight + 6.25 * height - 5 * age - 161;
  }
};

const calculateTDEE = (tmb, activityLevel) => {
  const factors = { sedentary: 1.2, light: 1.375, moderate: 1.55, active: 1.725, veryActive: 1.9 };
  return tmb * (factors[activityLevel] || 1.55);
};

const calculateCalorieGoal = (tdee, objective, weight, weeklyWeightChange = null) => {
  let adjustedGoal = tdee;
  switch(objective) {
    case "weightLoss":
      adjustedGoal = (weeklyWeightChange !== null && weeklyWeightChange === 0) 
        ? Math.round(tdee * 0.92) 
        : Math.round(tdee - 400);
      break;
    case "muscleGain":
      adjustedGoal = Math.round(tdee + 400);
      break;
    default:
      adjustedGoal = Math.round(tdee);
  }
  return { goal: adjustedGoal, tdee: Math.round(tdee) };
};

const calculateMacroTargets = (calories, objective, weight) => {
  switch(objective) {
    case "weightLoss":
      const proteinLossG = Math.min(weight * 2.2, (calories * 0.40) / 4);
      const fatLossG = (calories * 0.25) / 9;
      const carbLossG = (calories - (proteinLossG * 4 + fatLossG * 9)) / 4;
      return { protein: Math.round(proteinLossG), carbs: Math.round(carbLossG), fat: Math.round(fatLossG), proteinPercent: 40, carbPercent: 35, fatPercent: 25 };
    case "muscleGain":
      const proteinGainG = Math.min(weight * 2.0, (calories * 0.35) / 4);
      const fatGainG = (calories * 0.25) / 9;
      const carbGainG = (calories - (proteinGainG * 4 + fatGainG * 9)) / 4;
      return { protein: Math.round(proteinGainG), carbs: Math.round(carbGainG), fat: Math.round(fatGainG), proteinPercent: 35, carbPercent: 55, fatPercent: 25 };
    default:
      const proteinMainG = Math.min(weight * 1.6, (calories * 0.30) / 4);
      const fatMainG = (calories * 0.30) / 9;
      const carbMainG = (calories - (proteinMainG * 4 + fatMainG * 9)) / 4;
      return { protein: Math.round(proteinMainG), carbs: Math.round(carbMainG), fat: Math.round(fatMainG), proteinPercent: 30, carbPercent: 45, fatPercent: 25 };
  }
};

const calculateExerciseCalories = (activity, duration, weight) => {
  const mets = { walking: 3.5, running: 9.8, cycling: 8, swimming: 8, weightlifting: 6, hiit: 12, yoga: 3, cardio: 7, pilates: 4, crossfit: 11, futbol: 10, tenis: 8.5 };
  const met = mets[activity] || 5;
  return Math.round((met * weight * duration) / 60);
};

const predictGoalDate = (currentWeight, goalWeight, weightHistory, objective) => {
  const recentWeights = weightHistory.filter(w => w !== null).slice(-14);
  if(recentWeights.length < 7) return null;
  const avgWeeklyChange = (recentWeights[recentWeights.length - 1] - recentWeights[0]) / 2;
  if(avgWeeklyChange === 0) return null;
  const kgsToGo = goalWeight - currentWeight;
  const weeksNeeded = Math.abs(kgsToGo / avgWeeklyChange);
  const targetDate = new Date();
  targetDate.setDate(targetDate.getDate() + weeksNeeded * 7);
  return { date: targetDate, weeks: Math.round(weeksNeeded), weeklyChange: rnd(avgWeeklyChange) };
};

const detectPlateau = (weightHistory) => {
  const recentWeights = weightHistory.filter(w => w !== null).slice(-14);
  if(recentWeights.length < 14) return false;
  const variance = recentWeights.reduce((sum, w) => sum + Math.pow(w - recentWeights[0], 2)) / recentWeights.length;
  return variance < 0.01;
};

/* ════════════════════════════════════════════════════════════════════════ */
function App() {
  const [tab, setTab] = useState("hoy");
  const [date, setDate] = useState(t0());
  const [goal, setGoal] = useState(2000);
  const [macroTargets, setMacroTargets] = useState({protein:150,carbs:275,fat:67,proteinPercent:30,carbPercent:45,fatPercent:25});
  const [modal, setModal] = useState(null);
  const [query, setQuery] = useState("");
  const [selFood, setSelFood] = useState(null);
  const [amount, setAmount] = useState(100);
  const [meal, setMeal] = useState("Desayuno");
  const [log, setLog] = useState(()=>JSON.parse(localStorage.getItem("cal_log3")||"{}"));
  const [workoutLog, setWorkoutLog] = useState(()=>JSON.parse(localStorage.getItem("workout_log")||"{}"));
  const [customDB, setCustomDB] = useState(()=>JSON.parse(localStorage.getItem("cal_custom")||"[]"));
  const [detEntry, setDetEntry] = useState(null);
  const [newFood, setNewFood] = useState({n:"",cal:"",pro:"",car:"",fat:"",cat:"⭐ Mis alimentos",u:"g"});
  const [userProfile, setUserProfile] = useState(()=>JSON.parse(localStorage.getItem("cal_profile")||JSON.stringify({weight:70,height:170,age:30,sex:"M",activityLevel:"moderate",objective:"maintenance",goalWeight:70})));
  const [water, setWaterState] = useState(8);
  const [waterGoal] = useState(16);
  const [searchRef] = useState(useRef(null));
  const [selWorkout, setSelWorkout] = useState(null);
  const [workoutDuration, setWorkoutDuration] = useState(45);

  const DB = useMemo(()=>[...DB_BASE,...customDB],[customDB]);

  const recalculateGoal = (profile) => {
    const {weight, height, age, sex, activityLevel, objective} = profile;
    const tmb = calculateTMB(weight, height, age, sex);
    const tdee = calculateTDEE(tmb, activityLevel);
    const { goal: adjustedGoal } = calculateCalorieGoal(tdee, objective, weight);
    const macros = calculateMacroTargets(adjustedGoal, objective, weight);
    setGoal(adjustedGoal);
    setMacroTargets(macros);
    localStorage.setItem("cal_goal", adjustedGoal);
  };

  useEffect(()=>{
    recalculateGoal(userProfile);
  },[userProfile]);

  const saveLog = l => { setLog(l); localStorage.setItem("cal_log3",JSON.stringify(l)); };
  const saveWorkoutLog = wl => { setWorkoutLog(wl); localStorage.setItem("workout_log",JSON.stringify(wl)); };
  const saveCustom = c => { setCustomDB(c); localStorage.setItem("cal_custom",JSON.stringify(c)); };

  const dateKey = dk(date);
  const dayData = log[dateKey] || { entries:[], water:0, weight:null };
  const workoutDayData = workoutLog[dateKey] || { workouts: [] };
  const entries = dayData.entries || [];
  const weightVal = dayData.weight || "";
  const workouts = workoutDayData.workouts || [];

  const updateDay = (patch) => {
    const updated = {...log, [dateKey]: {...dayData, ...patch}};
    saveLog(updated);
  };

  const updateWorkoutDay = (patch) => {
    const updated = {...workoutLog, [dateKey]: {...workoutDayData, ...patch}};
    saveWorkoutLog(updated);
  };

  const totals = useMemo(()=>entries.reduce((a,e)=>({
    cal:a.cal+e.cal, pro:a.pro+e.pro, car:a.car+e.car, fat:a.fat+e.fat
  }),{cal:0,pro:0,car:0,fat:0}),[entries]);

  const caloriesBurnedWorkouts = useMemo(()=>workouts.reduce((sum, w)=>sum+w.calories, 0), [workouts]);
  const netCalories = totals.cal - caloriesBurnedWorkouts;
  const totalCalorieGoal = goal + caloriesBurnedWorkouts;

  const filtered = useMemo(()=>{
    if(!query.trim()) return [];
    const q=query.toLowerCase();
    return DB.filter(f=>f.n.toLowerCase().includes(q)).slice(0,14);
  },[query,DB]);

  const selectFood = f => { setSelFood(f); setAmount(f.base||100); setQuery(f.n); };

  const calcEntry = (food,amt) => {
    const base=food.base||100, factor=amt/base;
    return { id:Date.now().toString(), foodId:food.id, name:food.n, meal, amount:amt, unit:food.u,
      cal:Math.round(food.cal*factor), pro:rnd(food.pro*factor),
      car:rnd(food.car*factor), fat:rnd(food.fat*factor) };
  };

  const addEntry = () => {
    if(!selFood) return;
    updateDay({ entries:[...entries, calcEntry(selFood,amount)] });
    setModal(null); setQuery(""); setSelFood(null); setAmount(100);
  };

  const removeEntry = id => {
    updateDay({ entries: entries.filter(e=>e.id!==id) });
    setDetEntry(null); setModal(null);
  };

  const addWorkout = () => {
    if(!selWorkout) return;
    const calories = calculateExerciseCalories(selWorkout.activity, workoutDuration, userProfile.weight);
    const workout = {
      id: Date.now().toString(),
      name: selWorkout.name,
      activity: selWorkout.activity,
      duration: workoutDuration,
      calories: calories
    };
    updateWorkoutDay({ workouts: [...workouts, workout] });
    setModal(null);
    setSelWorkout(null);
    setWorkoutDuration(45);
  };

  const removeWorkout = id => {
    updateWorkoutDay({ workouts: workouts.filter(w=>w.id!==id) });
    setModal(null);
  };

  const setWater = n => updateDay({ water: Math.max(0,Math.min(n,16)) });
  const setWeightVal = v => updateDay({ weight: v });

  const weightHistory = useMemo(()=>Array.from({length:14},(_,i)=>{
    const d=ad(t0(),-13+i), k=dk(d);
    return (log[k]?.weight) ? Number(log[k].weight) : null;
  }),[log]);

  const saveNewFood = () => {
    const {n,cal,pro,car,fat,cat,u} = newFood;
    if(!n.trim()||!cal) { alert("Nombre y calorías son obligatorios"); return; }
    const food = { id:"c"+Date.now(), n:n.trim(), cal:Number(cal), pro:Number(pro)||0,
      car:Number(car)||0, fat:Number(fat)||0, cat, u, custom:true };
    saveCustom([...customDB, food]);
    setNewFood({n:"",cal:"",pro:"",car:"",fat:"",cat:"⭐ Mis alimentos",u:"g"});
    setModal("add");
  };

  // Sugerencias de recetas inteligentes
  const suggestedRecipes = useMemo(()=>{
    const remaining = {
      cal: Math.max(0, totalCalorieGoal - netCalories),
      pro: Math.max(0, macroTargets.protein - totals.pro),
      carbs: Math.max(0, macroTargets.carbs - totals.car),
      fat: Math.max(0, macroTargets.fat - totals.fat)
    };

    return RECIPES_DB
      .filter(r => 
        r.objective.includes(userProfile.objective) &&
        r.cal <= remaining.cal * 1.2 &&
        r.pro <= remaining.pro * 1.2 &&
        r.carbs <= remaining.carbs * 1.2 &&
        r.fat <= remaining.fat * 1.2
      )
      .sort((a,b)=>{
        const fitA = Math.abs(a.cal - remaining.cal) + Math.abs(a.pro - remaining.pro);
        const fitB = Math.abs(b.cal - remaining.cal) + Math.abs(b.pro - remaining.pro);
        return fitA - fitB;
      })
      .slice(0, 5);
  }, [totals, macroTargets, userProfile.objective, totalCalorieGoal, netCalories]);

  const pct = netCalories/goal;
  const rem = goal - Math.round(netCalories);

  const isPlateau = useMemo(() => detectPlateau(weightHistory), [weightHistory]);

  const prediction = useMemo(() => {
    const w = Number(weightVal);
    const gw = userProfile.goalWeight;
    if(!w || !gw || w === gw) return null;
    return predictGoalDate(w, gw, weightHistory, userProfile.objective);
  }, [weightVal, userProfile, weightHistory]);

  const openAdd = m => {
    setMeal(m||"Desayuno");
    setModal("add");
    setTimeout(()=>searchRef.current?.focus(),120);
  };

  // Base de datos de actividades
  const activities = [
    { name: "Caminata", activity: "walking" },
    { name: "Trote", activity: "running" },
    { name: "Ciclismo", activity: "cycling" },
    { name: "Natación", activity: "swimming" },
    { name: "Pesas", activity: "weightlifting" },
    { name: "HIIT", activity: "hiit" },
    { name: "Yoga", activity: "yoga" },
    { name: "Cardio", activity: "cardio" },
    { name: "Pilates", activity: "pilates" },
    { name: "CrossFit", activity: "crossfit" },
    { name: "Fútbol", activity: "futbol" },
    { name: "Tenis", activity: "tenis" },
  ];

  return (
    <div style={{minHeight:"100vh",background:"#F2F7F4"}}>

      {/* TOPBAR */}
      <div style={{background:GREEN,color:"#fff",padding:"12px 16px 0"}}>
        <div style={{fontSize:10,opacity:.7,letterSpacing:".1em",textTransform:"uppercase"}}>NUTRIPEAK v2.1</div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:2,marginBottom:10,gap:8}}>
          <button onClick={()=>setModal("goal")} style={{background:"rgba(255,255,255,.2)",border:"none",borderRadius:99,padding:"4px 12px",color:"#fff",fontSize:12}}>
            Meta: {goal} kcal
          </button>
          <div style={{fontSize:15,fontWeight:700}}>Mi registro</div>
          <button onClick={()=>setModal("feedback")} style={{background:"rgba(255,255,255,.2)",border:"none",borderRadius:99,padding:"4px 12px",color:"#fff",fontSize:12,cursor:"pointer",fontWeight:600}}>
            💬 Feedback
          </button>
        </div>
        <div style={{display:"flex",gap:4,overflowX:"auto"}}>
          {[["hoy","Hoy"],["entrenamientos","💪"],["mis","Alimentos"],["recetas","🍽️"],["analisis","📊"]].map(([k,l])=>(
            <button key={k} onClick={()=>setTab(k)} style={{
              background:tab===k?"rgba(255,255,255,.25)":"transparent",
              border:"none",borderRadius:"8px 8px 0 0",padding:"6px 12px",
              color:"#fff",fontSize:12,fontWeight:tab===k?700:400,whiteSpace:"nowrap"
            }}>{l}</button>
          ))}
        </div>
      </div>

      {/* ══════ TAB HOY ══════ */}
      {tab==="hoy" && (
        <div style={{padding:14}}>

          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
            <button onClick={()=>setDate(d=>ad(d,-1))} style={{background:"#fff",border:"1px solid #ddd",borderRadius:8,padding:"6px 12px",fontSize:14}}>‹</button>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:14,fontWeight:600}}>{fmt(date)}</div>
              {dk(date)===dk(t0())&&<div style={{fontSize:11,color:GREEN,fontWeight:600}}>Hoy</div>}
            </div>
            <button onClick={()=>setDate(d=>ad(d,1))} disabled={dk(date)===dk(t0())}
              style={{background:"#fff",border:"1px solid #ddd",borderRadius:8,padding:"6px 12px",fontSize:14,opacity:dk(date)===dk(t0())?.3:1}}>›</button>
          </div>

          {/* Resumen calorías CON ENTRENAMIENTOS */}
          <div style={{background:"#fff",borderRadius:16,padding:16,marginBottom:12,display:"flex",alignItems:"center",gap:14,boxShadow:"0 1px 8px rgba(0,0,0,.07)"}}>
            <Ring pct={pct} label={Math.round(netCalories)} sub="kcal netas"/>
            <div style={{flex:1}}>
              <div style={{fontSize:12,color:"#555",marginBottom:4}}>
                <div>{Math.round(totals.cal)} consumidas</div>

      {/* ══════ TAB ENTRENAMIENTOS ══════ */}

          </div>

          {/* Rutinas preestablecidas */}
          <div style={{fontSize:13,fontWeight:600,marginBottom:12}}>Rutinas sugeridas</div>
          {WORKOUTS_DB.map(w=>(
            <div key={w.id} style={{background:"#fff",borderRadius:12,padding:12,marginBottom:8,boxShadow:"0 1px 4px rgba(0,0,0,.04)"}}>

              <div style={{fontSize:11,color:"#666",marginBottom:10}}>
                {w.exercises.map(e=>`${e.sets}x${e.reps} ${e.name}`).join(" • ")}

            </div>
          ))}
        </div>

      {/* ══════ TAB RECETAS ══════ */}
      {tab==="recetas" && (
        <div style={{padding:14}}>
          <div style={{fontSize:15,fontWeight:700,marginBottom:14}}>
            Recetas sugeridas para hoy

          {suggestedRecipes.length === 0

            : suggestedRecipes.map(r=>(
              <div key={r.id} style={{background:"#fff",borderRadius:14,padding:14,marginBottom:12,boxShadow:"0 1px 6px rgba(0,0,0,.06)"}}>

                    <div style={{fontSize:14,fontWeight:700}}>{r.name}</div>

                      amount: r.servings*100,
                      unit: "g",
                      cal: r.cal,
                      pro: r.pro,
                      car: r.carbs,
                      fat: r.fat

                    updateDay({entries:[...entries, entry]});

                    <div style={{fontSize:12,fontWeight:600}}>{r.name}</div>

                  </div>
                </div>
              </div>

          </div>

              </ul>
            </div>
          </div>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>

                <div key={l} style={{background:c+"15",borderRadius:10,padding:10,textAlign:"center"}}>
                  <div style={{fontSize:18,fontWeight:700,color:c}}>{v}</div>
                  <div style={{fontSize:10,color:"#999"}}>{l}</div>
                </div>
              ))}
            </div>
            <button onClick={()=>removeEntry(detEntry.id)} style={{width:"100%",padding:11,background:"#FEE2E2",color:"#991B1B",border:"none",borderRadius:10,fontWeight:700,fontSize:13,cursor:"pointer"}}>Eliminar</button>
          </div>

          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,padding:20,width:"100%",maxWidth:320}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:12}}>{detEntry.name}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>

                  <div style={{fontSize:18,fontWeight:700,color:c}}>{v}</div>
                  <div style={{fontSize:10,color:"#999"}}>{l}</div>
                </div>

            </div>
            <button onClick={()=>removeWorkout(detEntry.id)} style={{width:"100%",padding:11,background:"#FEE2E2",color:"#991B1B",border:"none",borderRadius:10,fontWeight:700,fontSize:13,cursor:"pointer"}}>Eliminar</button>
          </div>
        </div>
      )}

      {/* ══════ MODAL AGREGAR COMIDA ══════ */}
      {modal==="add" && (
        <div onClick={()=>setModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:1100,padding:20}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:20,width:"100%",maxWidth:480,maxHeight:"80vh",overflowY:"auto"}}>

                  const p=calcEntry(selFood,amount);

                    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:4,textAlign:"center",background:"#f9f9f9",borderRadius:10,padding:10}}>
                      {[["Cal",p.cal,"kcal"],["Pro",p.pro,"g"],["Carb",p.car,"g"],["Gra",p.fat,"g"]].map(([l,v,u])=>(
                        <div key={l}><div style={{fontSize:14,fontWeight:700}}>{v}</div><div style={{fontSize:9,color:"#aaa"}}>{l}</div></div>

          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:20,width:"100%",maxWidth:480,maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:4}}>Crear alimento personalizado</div>
            <div style={{fontSize:12,color:"#888",marginBottom:14}}>Los valores son por 100g o por unidad según corresponda.</div>

            <div style={{marginBottom:10}}>
              <label style={{fontSize:12,color:"#666",display:"block",marginBottom:3}}>Nombre *</label>
              <input value={newFood.n} onChange={e=>setNewFood(f=>({...f,n:e.target.value}))} placeholder="Ej: Wrap de pollo casero"/>
            </div>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
              <div>
                <label style={{fontSize:12,color:"#666",display:"block",marginBottom:3}}>Calorías (kcal) *</label>
                <input type="number" value={newFood.cal} onChange={e=>setNewFood(f=>({...f,cal:e.target.value}))} placeholder="ej: 250" style={{textAlign:"center"}}/>
              </div>
              <div>
                <label style={{fontSize:12,color:"#666",display:"block",marginBottom:3}}>Unidad</label>
                <select value={newFood.u} onChange={e=>setNewFood(f=>({...f,u:e.target.value}))} style={{textAlign:"center"}}>
                  <option value="g">gramos (g)</option>
                  <option value="ml">mililitros (ml)</option>
                  <option value="un">unidades (un)</option>
                  <option value="pl">porción (pl)</option>
                </select>
              </div>
            </div>

            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:10}}>
              <div>
                <label style={{fontSize:12,color:"#666",display:"block",marginBottom:3}}>Proteínas (g)</label>
                <input type="number" value={newFood.pro} onChange={e=>setNewFood(f=>({...f,pro:e.target.value}))} placeholder="0" style={{textAlign:"center"}}/>
              </div>
              <div>
                <label style={{fontSize:12,color:"#666",display:"block",marginBottom:3}}>Carbos (g)</label>
                <input type="number" value={newFood.car} onChange={e=>setNewFood(f=>({...f,car:e.target.value}))} placeholder="0" style={{textAlign:"center"}}/>
              </div>
              <div>
                <label style={{fontSize:12,color:"#666",display:"block",marginBottom:3}}>Grasas (g)</label>
                <input type="number" value={newFood.fat} onChange={e=>setNewFood(f=>({...f,fat:e.target.value}))} placeholder="0" style={{textAlign:"center"}}/>
              </div>
            </div>

            <div style={{marginBottom:16}}>
              <label style={{fontSize:12,color:"#666",display:"block",marginBottom:3}}>Categoría</label>
              <select value={newFood.cat} onChange={e=>setNewFood(f=>({...f,cat:e.target.value}))}>
                <option value="⭐ Mis alimentos">⭐ Mis alimentos</option>
                <option value="🥩 Proteínas">🥩 Proteínas</option>
                <option value="🌾 Cereales">🌾 Cereales</option>
                <option value="🥦 Verduras">🥦 Verduras</option>
                <option value="🍎 Frutas">🍎 Frutas</option>
                <option value="🇨🇱 Cocina chilena">🇨🇱 Cocina chilena</option>
                <option value="🥤 Bebidas">🥤 Bebidas</option>
                <option value="🍫 Snacks">🍫 Snacks</option>
                <option value="💪 Suplementos">💪 Suplementos</option>
              </select>
            </div>

            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setModal("add")} style={{flex:1,padding:12,background:"#f5f5f5",color:"#555",border:"none",borderRadius:10,fontSize:13,cursor:"pointer"}}>Atrás</button>
              <button onClick={saveNewFood} style={{flex:2,padding:12,background:GREEN,color:"#fff",border:"none",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer"}}>Guardar alimento</button>
            </div>
          </div>
        </div>
      )}

      {/* ══════ MODAL AGREGAR ENTRENAMIENTO ══════ */}
      {modal==="workout" && (
        <div onClick={()=>setModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:1100,padding:20}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:20,width:"100%",maxWidth:480,maxHeight:"80vh",overflowY:"auto"}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:14}}>Agregar entrenamiento</div>

            <label style={{fontSize:12,color:"#666",display:"block",marginBottom:8}}>Tipo de actividad *</label>
            <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8,marginBottom:14}}>
              {activities.map(a=>(
                <button key={a.activity} onClick={()=>setSelWorkout(a)}
                  style={{padding:12,background:selWorkout?.activity===a.activity?GREEN:"#f5f5f5",color:selWorkout?.activity===a.activity?"#fff":"#666",border:"none",borderRadius:10,fontWeight:600,fontSize:12,cursor:"pointer"}}>
                  {a.name}
                </button>
              ))}
            </div>

            {selWorkout && (
              <>
                <label style={{fontSize:12,color:"#666",display:"block",marginBottom:8}}>Duración (minutos) *</label>
                <input type="number" value={workoutDuration} onChange={e=>setWorkoutDuration(Number(e.target.value))} min={5} step={5}
                  style={{textAlign:"center",fontSize:20,fontWeight:700,marginBottom:16}}/>

                <div style={{background:"#ECFDF5",borderRadius:12,padding:12,marginBottom:14}}>
                  <div style={{fontSize:12,fontWeight:600,color:"#065F46",marginBottom:6}}>Resumen</div>
                  <div style={{fontSize:13,color:"#065F46"}}>
                    <div>{selWorkout.name}</div>
                    <div>{workoutDuration} minutos</div>
                    <div style={{fontWeight:700,fontSize:14,marginTop:4}}>
                      Quemarás ≈ {calculateExerciseCalories(selWorkout.activity, workoutDuration, userProfile.weight)} kcal
                    </div>
                  </div>
                </div>

                <button onClick={addWorkout} style={{width:"100%",padding:12,background:GREEN,color:"#fff",border:"none",borderRadius:10,fontWeight:700,fontSize:14,cursor:"pointer",marginBottom:8}}>
                  ✓ Agregar entrenamiento
                </button>
              </>
            )}

            <button onClick={()=>setModal(null)} style={{width:"100%",padding:12,background:"#f0f0f0",color:"#555",border:"none",borderRadius:10,fontSize:14,cursor:"pointer"}}>
              Cancelar
            </button>
          </div>
        </div>
      )}

      {/* ══════ MODAL META ══════ */}
      {modal==="goal" && (
        <div onClick={()=>setModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:20}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,padding:20,width:"100%",maxWidth:400,maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:14}}>Configuración</div>

            <div style={{background:"#f9f9f9",borderRadius:12,padding:14,marginBottom:14}}>
              <div style={{fontSize:13,fontWeight:600,color:"#333",marginBottom:10}}>Tus datos</div>
              
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                <div>
                  <label style={{fontSize:11,color:"#666",display:"block",marginBottom:4}}>Peso (kg)</label>
                  <input type="number" value={userProfile.weight} onChange={e=>{const p={...userProfile,weight:Number(e.target.value)}; setUserProfile(p); localStorage.setItem("cal_profile",JSON.stringify(p));}} style={{textAlign:"center"}}/>
                </div>
                <div>
                  <label style={{fontSize:11,color:"#666",display:"block",marginBottom:4}}>Altura (cm)</label>
                  <input type="number" value={userProfile.height} onChange={e=>{const p={...userProfile,height:Number(e.target.value)}; setUserProfile(p); localStorage.setItem("cal_profile",JSON.stringify(p));}} style={{textAlign:"center"}}/>
                </div>
              </div>

              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                <div>
                  <label style={{fontSize:11,color:"#666",display:"block",marginBottom:4}}>Edad</label>
                  <input type="number" value={userProfile.age} onChange={e=>{const p={...userProfile,age:Number(e.target.value)}; setUserProfile(p); localStorage.setItem("cal_profile",JSON.stringify(p));}} style={{textAlign:"center"}}/>
                </div>
                <div>
                  <label style={{fontSize:11,color:"#666",display:"block",marginBottom:4}}>Sexo</label>
                  <select value={userProfile.sex} onChange={e=>{const p={...userProfile,sex:e.target.value}; setUserProfile(p); localStorage.setItem("cal_profile",JSON.stringify(p));}} style={{textAlign:"center"}}>
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                  </select>
                </div>
              </div>
            </div>

            <div style={{background:"#f9f9f9",borderRadius:12,padding:14,marginBottom:14}}>
              <div style={{fontSize:13,fontWeight:600,color:"#333",marginBottom:10}}>Mi objetivo</div>
              
              <label style={{fontSize:11,color:"#666",display:"block",marginBottom:8}}>Actividad</label>
              <select value={userProfile.activityLevel} onChange={e=>{const p={...userProfile,activityLevel:e.target.value}; setUserProfile(p); localStorage.setItem("cal_profile",JSON.stringify(p));}} style={{marginBottom:12}}>
                <option value="sedentary">Sedentario</option>
                <option value="light">Ligero (1-3 días/semana)</option>
                <option value="moderate">Moderado (3-5 días/semana)</option>
                <option value="active">Activo (6-7 días/semana)</option>
                <option value="veryActive">Muy activo</option>
              </select>

              <label style={{fontSize:11,color:"#666",display:"block",marginBottom:8}}>Objetivo</label>
              <select value={userProfile.objective} onChange={e=>{const p={...userProfile,objective:e.target.value}; setUserProfile(p); localStorage.setItem("cal_profile",JSON.stringify(p));}} style={{marginBottom:12}}>
                <option value="weightLoss">Pérdida de peso</option>
                <option value="maintenance">Mantenimiento</option>
                <option value="muscleGain">Ganancia muscular</option>
              </select>

              <label style={{fontSize:11,color:"#666",display:"block",marginBottom:4}}>Meta de peso (kg)</label>
              <input type="number" value={userProfile.goalWeight} onChange={e=>{const p={...userProfile,goalWeight:Number(e.target.value)}; setUserProfile(p); localStorage.setItem("cal_profile",JSON.stringify(p));}} style={{textAlign:"center"}}/>
            </div>

            <button onClick={()=>setModal(null)} style={{width:"100%",padding:12,background:GREEN,color:"#fff",border:"none",borderRadius:10,fontWeight:700,cursor:"pointer"}}>Guardar</button>
          </div>
        </div>
      )}

      {/* ══════ MODAL FEEDBACK PROFESIONAL ══════ */}
      {modal==="feedback" && (
        <div onClick={()=>setModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:20}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,padding:20,width:"100%",maxWidth:500,maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{fontSize:16,fontWeight:700,marginBottom:4}}>Feedback y Soporte</div>
            <div style={{fontSize:12,color:"#888",marginBottom:16}}>Tu opinión es importante. Completa el formulario para ayudarnos a mejorar.</div>

            <form action="https://formspree.io/f/xpqnywvp" method="POST" style={{display:"flex",flexDirection:"column",gap:12}}>
              
              {/* Datos básicos */}
              <div>
                <label style={{fontSize:12,fontWeight:600,color:"#666",marginBottom:4,display:"block"}}>Nombre Completo *</label>
                <input type="text" name="nombre" placeholder="Tu nombre" required style={{width:"100%",padding:10,borderRadius:8,border:"1px solid #e0e0e0",fontSize:13}}/>
              </div>

              <div>
                <label style={{fontSize:12,fontWeight:600,color:"#666",marginBottom:4,display:"block"}}>Email *</label>
                <input type="email" name="email" placeholder="tu@email.com" required style={{width:"100%",padding:10,borderRadius:8,border:"1px solid #e0e0e0",fontSize:13}}/>
              </div>

              {/* Contacto adicional */}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                <div>
                  <label style={{fontSize:12,fontWeight:600,color:"#666",marginBottom:4,display:"block"}}>Teléfono</label>
                  <input type="tel" name="telefono" placeholder="+56912345678" style={{width:"100%",padding:10,borderRadius:8,border:"1px solid #e0e0e0",fontSize:13}}/>
                </div>
                <div>
                  <label style={{fontSize:12,fontWeight:600,color:"#666",marginBottom:4,display:"block"}}>País</label>
                  <input type="text" name="pais" placeholder="Chile" style={{width:"100%",padding:10,borderRadius:8,border:"1px solid #e0e0e0",fontSize:13}}/>
                </div>
              </div>

              {/* Redes sociales */}
              <div>
                <label style={{fontSize:12,fontWeight:600,color:"#666",marginBottom:8,display:"block"}}>Redes Sociales (Opcional)</label>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  <input type="text" name="instagram" placeholder="Instagram" style={{width:"100%",padding:9,borderRadius:8,border:"1px solid #e0e0e0",fontSize:12}}/>
                  <input type="text" name="tiktok" placeholder="TikTok" style={{width:"100%",padding:9,borderRadius:8,border:"1px solid #e0e0e0",fontSize:12}}/>
                  <input type="text" name="twitter" placeholder="Twitter/X" style={{width:"100%",padding:9,borderRadius:8,border:"1px solid #e0e0e0",fontSize:12}}/>
                  <input type="text" name="linkedin" placeholder="LinkedIn" style={{width:"100%",padding:9,borderRadius:8,border:"1px solid #e0e0e0",fontSize:12}}/>
                </div>
              </div>

              {/* Mensaje */}
              <div>
                <label style={{fontSize:12,fontWeight:600,color:"#666",marginBottom:4,display:"block"}}>Tu Mensaje *</label>
                <textarea name="mensaje" placeholder="Cuéntanos qué te gustaría mejorar, reporta errores, o comparte sugerencias..." required style={{width:"100%",minHeight:120,padding:10,borderRadius:8,border:"1px solid #e0e0e0",fontSize:13,fontFamily:"inherit",resize:"vertical"}}/>
              </div>

              <input type="hidden" name="_subject" value="Nuevo feedback de NUTRIPEAK v2.1"/>
              <input type="hidden" name="_captcha" value="false"/>
              
              {/* Botones */}
              <div style={{display:"flex",gap:8,marginTop:8}}>
                <button type="submit" style={{flex:1,padding:12,background:GREEN,color:"#fff",border:"none",borderRadius:10,fontWeight:700,fontSize:13,cursor:"pointer"}}>✓ Enviar Feedback</button>
                <button type="button" onClick={()=>setModal(null)} style={{flex:1,padding:12,background:"#f5f5f5",color:"#555",border:"none",borderRadius:10,fontSize:13,cursor:"pointer"}}>Cancelar</button>
              </div>
            </form>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

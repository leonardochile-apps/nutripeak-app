const Ring = ({pct, label, sub}) => {
  const radius = 45, circ = 2 * Math.PI * radius;
  const offset = circ * (1 - Math.min(pct, 1));
  const color = pct > 1 ? "#EF4444" : pct > 0.9 ? "#F59E0B" : GREEN;
  return (
    <svg width="120" height="120" style={{transform:"rotate(-90deg)"}}>
      <circle cx="60" cy="60" r={radius} fill="none" stroke="#f0f0f0" strokeWidth="8"/>
      <circle cx="60" cy="60" r={radius} fill="none" stroke={color} strokeWidth="8" strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" style={{transition:"stroke-dashoffset .4s"}}/>
      <text x="60" y="60" textAnchor="middle" dy="0.3em" fontSize="24" fontWeight="700" fill={color}>{label}</text>
      <text x="60" y="75" textAnchor="middle" fontSize="10" fill="#888">{sub}</text>
    </svg>
  );
};

const MacroBar = ({label, val, max, color}) => (
  <div style={{marginBottom:10}}>
    <div style={{display:"flex",justifyContent:"space-between",fontSize:11,fontWeight:600,color:"#666",marginBottom:4}}>
      <span>{label}</span>
      <span>{Math.round(val)}g / {Math.round(max)}g</span>
    </div>
    <div style={{height:6,background:"#f0f0f0",borderRadius:3,overflow:"hidden"}}>
      <div style={{height:"100%",width:`${Math.min(val/max,1)*100}%`,background:color,transition:"width .4s"}}/>
    </div>
  </div>
);

const WeightChart = ({data}) => {
  const filteredData = data.filter(v => v !== null);
  if(filteredData.length < 2) return <div style={{fontSize:11,color:"#ccc"}}>Sin datos suficientes</div>;
  const min = Math.min(...filteredData), max = Math.max(...filteredData);
  const range = max - min || 1;
  return (
    <svg width="100%" height="60" preserveAspectRatio="none" style={{marginBottom:4}}>
      {data.map((v,i)=>{
        if(v===null) return null;
        const x = (i / (data.length-1)) * 100;
        const y = 100 - ((v - min) / range * 100);
        return <circle key={i} cx={`${x}%`} cy={`${y}%`} r="2" fill={GREEN}/>;
      })}
    </svg>
  );
};

  useEffect(() => { localStorage.setItem("user_age", age); }, [age]);
  useEffect(() => { localStorage.setItem("user_sex", sex); }, [sex]);

  useEffect(() => { localStorage.setItem("selected_routine", selectedRoutine); }, [selectedRoutine]);

  const calculateMetrics = () => {
    let tmb;
    if(sex === "M") {
      tmb = 10 * weight + 6.25 * height - 5 * age + 5;
    } else {
      tmb = 10 * weight + 6.25 * height - 5 * age - 161;
    }
    
    const tdee = tmb * activityLevel;
    let dailyGoal;
    
    switch(objective) {
      case "weightLoss":
        dailyGoal = Math.round(tdee - 450);
        break;
      case "muscleGain":
        dailyGoal = Math.round(tdee + 350);
        break;
      default:
        dailyGoal = Math.round(tdee);
    }
    
    let proteinG, carbsPercent, fatsPercent;
    if(objective === "muscleGain") {
      proteinG = Math.round(weight * 2.0);
      fatsPercent = 0.25;
      carbsPercent = 1 - (proteinG * 4 / dailyGoal) - fatsPercent;
    } else if(objective === "weightLoss") {
      proteinG = Math.round(weight * 1.8);
      fatsPercent = 0.25;
      carbsPercent = 1 - (proteinG * 4 / dailyGoal) - fatsPercent;
    } else {
      proteinG = Math.round(weight * 1.6);
      carbsPercent = 0.55;
      fatsPercent = 0.30;
    }

    return {
      tmb: Math.round(tmb),
      tdee: Math.round(tdee),
      dailyGoal,
      protein: proteinG,
      carbs: Math.round(dailyGoal * carbsPercent / 4),
      fats: Math.round(dailyGoal * fatsPercent / 9),
      water: Math.round((weight / 2) * 0.03)
    };
  };

  const metrics = useMemo(calculateMetrics, [weight, height, age, sex, activityLevel, objective]);

  ];

  const DB = useMemo(() => [...DB_BASE, ...customDB], [customDB]);
  const filtered = useMemo(() => {
    if(!query.trim()) return [];

    return DB.filter(f => f.n.toLowerCase().includes(q)).slice(0, 14);
  }, [query, DB]);

  const selectFood = f => { setSelFood(f); setAmount(f.base || 100); setQuery(f.n); };

  const calcEntry = (food, amt) => {
    const base = food.base || 100, factor = amt / base;
    return {
      id: Date.now().toString(), foodId: food.id, name: food.n, meal, amount: amt, unit: food.u,
      cal: Math.round(food.cal * factor), pro: rnd(food.pro * factor),
      car: rnd(food.car * factor), fat: rnd(food.fat * factor)
    };
  };

  const addEntry = () => {
    if(!selFood) return;

              <MacroBar label="Proteína" val={totals.pro} max={metrics.protein} color="#3B82F6" />
              <MacroBar label="Carbohidratos" val={totals.car} max={metrics.carbs} color="#F97316" />
              <MacroBar label="Grasas" val={totals.fat} max={metrics.fats} color="#8B5CF6" />
            </div>
          </div>

          {/* Agua + Peso */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>

            {/* AGUA */}
            <div style={{ background: "#fff", borderRadius: 14, padding: 14, boxShadow: "0 1px 6px rgba(0,0,0,.06)" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                <div>
                  <div style={{ fontSize: 11, color: "#888" }}>Agua</div>
                  <div style={{ fontSize: 17, fontWeight: 700, color: BLUE }}>{dayWater}<span style={{ fontSize: 11, fontWeight: 400, color: "#aaa" }}>/{waterGoal}</span></div>
                  <div style={{ fontSize: 10, color: "#aaa" }}>{dayWater * 250} ml</div>
                </div>
                <div style={{ fontSize: 28 }}>💧</div>
              </div>
              
              {!editWaterGoal ? (
                <button onClick={() => setEditWaterGoal(true)} style={{ width: "100%", fontSize: 11, color: "#666", background: "transparent", border: "1px dashed #ddd", padding: 6, borderRadius: 6, cursor: "pointer", marginBottom: 8 }}>
                  Editar meta ({waterGoal})
                </button>
              ) : (
                <div style={{ marginBottom: 8 }}>
                  <input type="number" value={newWaterGoal} onChange={e => setNewWaterGoal(Number(e.target.value))} style={{ marginBottom: 6 }} />
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => { setWaterGoal(newWaterGoal); setEditWaterGoal(false); }} style={{ flex: 1, padding: "4px 0", background: GREEN, color: "#fff", border: "none", borderRadius: 6, fontSize: 11, fontWeight: 600, cursor: "pointer" }}>✓</button>
                    <button onClick={() => setEditWaterGoal(false)} style={{ flex: 1, padding: "4px 0", background: "#f5f5f5", color: "#555", border: "none", borderRadius: 6, fontSize: 11, cursor: "pointer" }}>✕</button>
                  </div>
                </div>
              )}
              
              <div style={{ display: "flex", gap: 4 }}>
                <button onClick={() => setDayWater(Math.max(0, dayWater - 1))} style={{ flex: 1, padding: "5px 0", background: "#f5f5f5", border: "none", borderRadius: 7, fontSize: 16, color: BLUE }}>−</button>
                <button onClick={() => setDayWater(Math.min(waterGoal + 2, dayWater + 1))} style={{ flex: 1, padding: "5px 0", background: LBLUE, border: "none", borderRadius: 7, fontSize: 16, color: BLUE }}>+</button>
              </div>
            </div>

            {/* PESO */}
            <div style={{ background: "#fff", borderRadius: 14, padding: 14, boxShadow: "0 1px 6px rgba(0,0,0,.06)" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
                <div>
                  <div style={{ fontSize: 11, color: "#888" }}>Peso corporal</div>
                  <div style={{ fontSize: 17, fontWeight: 700, color: GREEN }}>
                    {dayWeight || "—"}<span style={{ fontSize: 11, fontWeight: 400, color: "#aaa" }}> kg</span>
                  </div>
                </div>
                <div style={{ fontSize: 28 }}>⚖️</div>
              </div>
              <input type="number" value={dayWeight} step="0.1" min="30" max="300"
                placeholder="ej: 78.5"
                onChange={e => updateDay({ weight: e.target.value })}
                style={{ marginBottom: 8, textAlign: "center", fontWeight: 700, fontSize: 15, color: GREEN }} />
              <div style={{ overflow: "hidden" }}>
                <WeightChart data={weightHistory} />
                <div style={{ fontSize: 9, color: "#ccc", marginTop: 2 }}>Últimas 2 semanas</div>
              </div>
            </div>
          </div>

          {/* Registro por comida */}
          {MEALS.map(m => {
            const mE = entries.filter(e => e.meal === m);
            const mC = mE.reduce((s, e) => s + e.cal, 0);
            return (
              <div key={m} style={{ background: "#fff", borderRadius: 14, marginBottom: 10, overflow: "hidden", boxShadow: "0 1px 6px rgba(0,0,0,.06)" }}>
                <div style={{ padding: "10px 14px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: mE.length ? "1px solid #f5f5f5" : "none" }}>
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 600 }}>{m}</div>
                    {mC > 0 && <div style={{ fontSize: 11, color: "#999" }}>{Math.round(mC)} kcal</div>}
                  </div>
                  <button onClick={() => openAdd(m)} style={{ background: LGREEN, border: "none", borderRadius: 8, padding: "5px 12px", color: GREEN, fontSize: 13, fontWeight: 600 }}>+ Agregar</button>
                </div>
                {mE.map(e => (
                  <div key={e.id} onClick={() => { setDetEntry(e); setModal("detail"); }}
                    style={{ padding: "8px 14px", borderBottom: "1px solid #fafafa", display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 13 }}>{e.name}</div>
                      <div style={{ fontSize: 11, color: "#bbb" }}>{e.amount}{["g", "ml"].includes(e.unit) ? e.unit : ""} · P:{e.pro}g C:{e.car}g G:{e.fat}g</div>
                    </div>
                    <div style={{ fontWeight: 700, color: GREEN, fontSize: 14 }}>{e.cal}</div>
                    <div style={{ fontSize: 11, color: "#ccc" }}>kcal</div>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      )}

      {/* TAB EJERCICIOS */}
      {tab === "ejercicios" && (
        <div style={{ padding: 14 }}>
          <div style={{ background: "#fff", borderRadius: 14, padding: 14, marginBottom: 14, boxShadow: "0 1px 6px rgba(0,0,0,.06)" }}>
            <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 10 }}>Selecciona tu rutina</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 8 }}>
              {Object.entries(WORKOUT_ROUTINES).map(([key, routine]) => (
                <button key={key} onClick={() => setSelectedRoutine(key)} style={{
                  padding: 12, borderRadius: 10, border: "2px solid " + (selectedRoutine === key ? GREEN : "#ddd"),
                  background: selectedRoutine === key ? LGREEN : "#f9f9f9",
                  textAlign: "left", cursor: "pointer", transition: "all .2s"
                }}>
                  <div style={{ fontWeight: 700, color: GREEN }}>{routine.name}</div>
                  <div style={{ fontSize: 12, color: "#666", marginTop: 4 }}>{routine.description}</div>
                </button>
              ))}
            </div>
          </div>

          {/* Mostrar rutina seleccionada */}
          {WORKOUT_ROUTINES[selectedRoutine].days.map((day, idx) => {
            const dayKey = `${dateKey}-${day.day}`;
            const isCompleted = completedWorkouts[dayKey];
            const totalCalories = day.exercises.reduce((s, e) => s + e.calories, 0);
            
            return (
              <div key={idx} style={{ background: "#fff", borderRadius: 14, marginBottom: 12, overflow: "hidden", boxShadow: "0 1px 6px rgba(0,0,0,.06)" }}>
                <div style={{ padding: "12px 14px", background: isCompleted ? LGREEN : "#f9f9f9", borderBottom: "1px solid #f0f0f0", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                  <div>
                    <div style={{ fontWeight: 700, color: GREEN, marginBottom: 2 }}>{day.day}</div>
                    <div style={{ fontSize: 11, color: "#666" }}>~{totalCalories} kcal</div>
                  </div>
                  <button onClick={() => toggleWorkoutComplete(day.day)} style={{
                    padding: "6px 14px", borderRadius: 6, border: "none", background: isCompleted ? GREEN : "#ddd",
                    color: isCompleted ? "#fff" : "#666", fontWeight: 600, cursor: "pointer", fontSize: 12
                  }}>
                    {isCompleted ? "✓ Completado" : "Marcar"}
                  </button>
                </div>
                
                <div style={{ padding: 0 }}>
                  {day.exercises.map((ex, i) => (
                    <div key={i} style={{ padding: "12px 14px", borderBottom: i < day.exercises.length - 1 ? "1px solid #f5f5f5" : "none" }}>
                      <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 4 }}>{ex.name}</div>
                      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, fontSize: 11 }}>
                        <div>
                          <div style={{ color: "#999", marginBottom: 2 }}>Series</div>
                          <div style={{ fontWeight: 700, color: GREEN }}>{ex.sets}</div>
                        </div>
                        <div>
                          <div style={{ color: "#999", marginBottom: 2 }}>Reps</div>
                          <div style={{ fontWeight: 700, color: GREEN }}>{ex.reps}</div>
                        </div>
                        <div>
                          <div style={{ color: "#999", marginBottom: 2 }}>Descanso</div>
                          <div style={{ fontWeight: 700, color: GREEN }}>{ex.rest}s</div>
                        </div>
                        <div>
                          <div style={{ color: "#999", marginBottom: 2 }}>Kcal</div>
                          <div style={{ fontWeight: 700, color: GREEN }}>{ex.calories}</div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* TAB HISTORIAL */}
      {tab === "historial" && (
        <div style={{ padding: 14 }}>
          <div style={{ background: "#fff", borderRadius: 16, padding: 16, marginBottom: 12, boxShadow: "0 1px 8px rgba(0,0,0,.07)" }}>
            <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 12 }}>Calorías — últimos 7 días</div>
            {Array.from({length: 7}, (_, i) => {
              const d = ad(t0(), -6 + i), k = dk(d);
              const ents = log[k]?.entries || [];
              const cal = ents.reduce((s, e) => s + e.cal, 0);
              return (
                <div key={k} onClick={() => { setDate(d); setTab("hoy"); }}
                  style={{ display: "flex", alignItems: "center", gap: 12, padding: "9px 0", borderBottom: "1px solid #f8f8f8", cursor: "pointer" }}>
                  <div style={{ width: 44, fontSize: 12 }}>
                    <div style={{ fontWeight: dk(d) === dk(t0()) ? 700 : 400, color: dk(d) === dk(t0()) ? GREEN : "#333" }}>{DAYS[d.getDay()]}</div>
                    <div style={{ fontSize: 10, color: "#bbb" }}>{d.getDate()}/{d.getMonth() + 1}</div>
                  </div>
                  <div style={{ flex: 1, height: 8, background: "#eee", borderRadius: 99, overflow: "hidden" }}>
                    <div style={{ height: "100%", width: `${Math.min(cal / goal, 1) * 100}%`, background: cal > goal ? "#EF4444" : GREEN, borderRadius: 99 }} />
                  </div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: cal > goal ? "#EF4444" : "#333", minWidth: 72, textAlign: "right" }}>
                    {cal > 0 ? `${Math.round(cal)} kcal` : <span style={{ color: "#ddd", fontWeight: 400 }}>—</span>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* MODAL: META NUTRICIONAL */}
      {modal === "goal" && (
        <div onClick={() => setModal(null)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000, padding: 20 }}>
          <div onClick={e => e.stopPropagation()} style={{ background: "#fff", borderRadius: 16, padding: 20, width: "100%", maxWidth: 380, maxHeight: "90vh", overflowY: "auto" }}>
            <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 16, color: GREEN }}>Tu Perfil Nutricional v2.0</div>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
              <div>
                <label style={{ fontSize: 11, fontWeight: 600, color: "#666", display: "block", marginBottom: 4 }}>Peso (kg)</label>
                <input type="number" value={weight} onChange={e => setWeightState(Number(e.target.value))} />
              </div>
              <div>
                <label style={{ fontSize: 11, fontWeight: 600, color: "#666", display: "block", marginBottom: 4 }}>Altura (cm)</label>
                <input type="number" value={height} onChange={e => setHeightState(Number(e.target.value))} />
              </div>
              <div>
                <label style={{ fontSize: 11, fontWeight: 600, color: "#666", display: "block", marginBottom: 4 }}>Edad</label>
                <input type="number" value={age} onChange={e => setAgeState(Number(e.target.value))} />
              </div>
              <div>
                <label style={{ fontSize: 11, fontWeight: 600, color: "#666", display: "block", marginBottom: 4 }}>Sexo</label>
                <select value={sex} onChange={e => setSexState(e.target.value)}>
                  <option value="M">Masculino</option>
                  <option value="F">Femenino</option>
                </select>
              </div>
            </div>

            <div style={{ marginBottom: 16 }}>
              <label style={{ fontSize: 11, fontWeight: 600, color: "#666", display: "block", marginBottom: 6 }}>Nivel de Actividad</label>
              <select value={activityLevel} onChange={e => setActivityLevelState(Number(e.target.value))} style={{ width: "100%" }}>
                <option value={1.2}>Sedentario</option>
                <option value={1.375}>Ligero</option>
                <option value={1.55}>Moderado</option>
                <option value={1.725}>Activo</option>
                <option value={1.9}>Muy Activo</option>
              </select>
            </div>

            <div style={{ marginBottom: 16 }}>
              <label style={{ fontSize: 11, fontWeight: 600, color: "#666", display: "block", marginBottom: 6 }}>Objetivo</label>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
                {["weightLoss", "maintenance", "muscleGain"].map(o => (
                  <button key={o} onClick={() => setObjectiveState(o)} style={{
                    padding: 10, borderRadius: 8,
                    background: objective === o ? GREEN : "#f5f5f5",
                    color: objective === o ? "#fff" : "#333",
                    border: "none", fontWeight: 600, fontSize: 12, cursor: "pointer"
                  }}>
                    {o === "weightLoss" ? "📉 Pérdida" : o === "maintenance" ? "⚖️ Mant." : "💪 Ganancia"}
                  </button>
                ))}
              </div>
            </div>

            <div style={{ background: "#f9f9f9", borderRadius: 10, padding: 12, marginBottom: 16, fontSize: 13, lineHeight: 1.6 }}>
              <div style={{ fontWeight: 700, color: GREEN, marginBottom: 8 }}>📊 Métricas Calculadas</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                <div>
                  <div style={{ fontSize: 11, color: "#666" }}>TMB</div>
                  <div style={{ fontSize: 16, fontWeight: 700, color: GREEN }}>{metrics.tmb}</div>
                  <div style={{ fontSize: 10, color: "#aaa" }}>kcal/día</div>
                </div>
                <div>
                  <div style={{ fontSize: 11, color: "#666" }}>TDEE</div>
                  <div style={{ fontSize: 16, fontWeight: 700, color: GREEN }}>{metrics.tdee}</div>
                  <div style={{ fontSize: 10, color: "#aaa" }}>kcal/día</div>
                </div>
              </div>
            </div>

            <div style={{ background: "#f9f9f9", borderRadius: 10, padding: 12, marginBottom: 16, fontSize: 13, lineHeight: 1.6 }}>
              <div style={{ fontWeight: 700, color: GREEN, marginBottom: 8 }}>🎯 Macronutrientes v2.0</div>
              <div style={{ fontSize: 12, marginBottom: 8 }}>
                <strong>Proteína:</strong> {metrics.protein}g ({Math.round(metrics.protein * 4 / metrics.dailyGoal * 100)}%)
              </div>
              <div style={{ fontSize: 12, marginBottom: 8 }}>
                <strong>Carbohidratos:</strong> {metrics.carbs}g
              </div>
              <div style={{ fontSize: 12 }}>
                <strong>Grasas:</strong> {metrics.fats}g
              </div>
            </div>

            <div style={{ background: "#f0fdf4", borderRadius: 8, padding: 10, marginBottom: 16, fontSize: 12, color: GREEN, borderLeft: "3px solid " + GREEN }}>
              ✅ Meta: {goal} kcal/día
            </div>

            <button onClick={() => setModal(null)} style={{ width: "100%", padding: 11, background: GREEN, color: "#fff", border: "none", borderRadius: 10, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Listo</button>
          </div>
        </div>
      )}

      {/* MODAL: DETALLE ALIMENTO */}
      {modal === "detail" && detEntry && (
        <div onClick={() => setModal(null)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000, padding: 20 }}>
          <div onClick={e => e.stopPropagation()} style={{ background: "#fff", borderRadius: 16, padding: 20, width: "100%", maxWidth: 320 }}>
            <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 12 }}>{detEntry.name}</div>
            <div style={{ background: "#f5f5f5", borderRadius: 10, padding: 12, marginBottom: 16 }}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                <div>
                  <div style={{ fontSize: 10, color: "#666" }}>Cantidad</div>
                  <div style={{ fontSize: 16, fontWeight: 700, color: GREEN }}>{detEntry.amount}{["g", "ml"].includes(detEntry.unit) ? detEntry.unit : ""}</div>
                </div>
                <div>
                  <div style={{ fontSize: 10, color: "#666" }}>Calorías</div>
                  <div style={{ fontSize: 16, fontWeight: 700, color: GREEN }}>{detEntry.cal}</div>
                </div>
              </div>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginBottom: 16 }}>
              <div style={{ background: "#dbeafe", borderRadius: 8, padding: 12, textAlign: "center" }}>
                <div style={{ fontSize: 10, color: "#333" }}>Proteína</div>
                <div style={{ fontSize: 14, fontWeight: 700, color: "#3B82F6" }}>{detEntry.pro}g</div>
              </div>
              <div style={{ background: "#fed7aa", borderRadius: 8, padding: 12, textAlign: "center" }}>
                <div style={{ fontSize: 10, color: "#333" }}>Carbohid.</div>
                <div style={{ fontSize: 14, fontWeight: 700, color: "#F97316" }}>{detEntry.car}g</div>
              </div>
              <div style={{ background: "#e9d5ff", borderRadius: 8, padding: 12, textAlign: "center" }}>
                <div style={{ fontSize: 10, color: "#333" }}>Grasa</div>
                <div style={{ fontSize: 14, fontWeight: 700, color: "#8B5CF6" }}>{detEntry.fat}g</div>
              </div>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => removeEntry(detEntry.id)} style={{ flex: 1, padding: 11, background: "#ef4444", color: "#fff", border: "none", borderRadius: 10, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Eliminar</button>
              <button onClick={() => setModal(null)} style={{ flex: 1, padding: 11, background: "#f5f5f5", color: "#555", border: "none", borderRadius: 10, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Cerrar</button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL: AGREGAR ALIMENTO */}
      {modal === "add" && (
        <div onClick={() => setModal(null)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000, padding: 20 }}>
          <div onClick={e => e.stopPropagation()} style={{ background: "#fff", borderRadius: 16, padding: 20, width: "100%", maxWidth: 380, maxHeight: "90vh", overflowY: "auto" }}>
            <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 16, color: GREEN }}>Agregar alimento a {meal}</div>
            <input ref={searchRef} type="text" placeholder="Busca un alimento..." value={query} onChange={e => setQuery(e.target.value)} style={{ marginBottom: 12 }} />

            {filtered.length > 0 && (
              <div style={{ background: "#f5f5f5", borderRadius: 10, maxHeight: 300, overflowY: "auto", marginBottom: 12 }}>
                {filtered.map(f => (
                  <button key={f.id} onClick={() => selectFood(f)} style={{ width: "100%", padding: 12, textAlign: "left", border: "none", background: "transparent", borderBottom: "1px solid #eee", cursor: "pointer", fontSize: 13 }}>
                    <div style={{ fontWeight: 600 }}>{f.n}</div>
                    <div style={{ fontSize: 11, color: "#888" }}>{f.cal} kcal/100g</div>
                  </button>
                ))}
              </div>
            )}

            {selFood && (
              <div style={{ background: "#f9f9f9", borderRadius: 10, padding: 12, marginBottom: 12 }}>
                <div style={{ fontSize: 12, color: "#666", marginBottom: 6 }}>Cantidad</div>
                <input type="number" value={amount} onChange={e => setAmount(Number(e.target.value))} style={{ marginBottom: 12 }} />
                <div style={{ fontSize: 12, color: "#666", marginBottom: 4 }}>Calorías: {Math.round((amount / (selFood.base || 100)) * selFood.cal)} kcal</div>
              </div>
            )}

            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={addEntry} style={{ flex: 1, padding: 11, background: GREEN, color: "#fff", border: "none", borderRadius: 10, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Agregar</button>
              <button onClick={() => setModal(null)} style={{ flex: 1, padding: 11, background: "#f5f5f5", color: "#555", border: "none", borderRadius: 10, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Cerrar</button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL: INFO */}
      {modal === "info" && (
        <div onClick={() => setModal(null)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000, padding: 20 }}>
          <div onClick={e => e.stopPropagation()} style={{ background: "#fff", borderRadius: 16, padding: 20, width: "100%", maxWidth: 380 }}>
            <div style={{ textAlign: "center", marginBottom: 20 }}>
              <div style={{ fontSize: 28, fontWeight: 700, color: GREEN, marginBottom: 4 }}>NUTRIPEAK</div>
              <div style={{ fontSize: 12, color: "#888" }}>v2.0 - Control Nutricional Inteligente</div>
            </div>

            <div style={{ background: "#f9f9f9", borderRadius: 12, padding: 14, marginBottom: 16, fontSize: 13, lineHeight: 1.6 }}>
              <div style={{ fontWeight: 700, color: GREEN, marginBottom: 8 }}>✨ Características v2.0</div>
              <ul style={{ marginLeft: 16, color: "#666", listStyle: "none" }}>
                <li style={{marginBottom: 6}}>🎯 Macros inteligentes por objetivo</li>
                <li style={{marginBottom: 6}}>💪 Proteína científica (1.6-2.2g/kg)</li>
                <li style={{marginBottom: 6}}>💧 Agua editable con meta personalizada</li>
                <li style={{marginBottom: 6}}>⚡ Rutinas de ejercicios probadas</li>
                <li style={{marginBottom: 6}}>📊 Seguimiento de entrenamientos</li>
                <li>🔄 Todos los datos guardados automáticamente</li>
              </ul>
            </div>

            <button onClick={() => setModal(null)} style={{ width: "100%", padding: 11, background: GREEN, color: "#fff", border: "none", borderRadius: 10, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Cerrar</button>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

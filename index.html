const Ring = ({pct,label,sub}) => {
  const circum = 2 * Math.PI * 45;

};

const WeightChart = ({data}) => {
  const chartRef = useRef(null);

    const ctx = chartRef.current.getContext('2d');
    if(chartInstance.current) chartInstance.current.destroy();
    const validData = data.filter(v=>v!==null);
    if(validData.length===0) return;
    chartInstance.current = new Chart(ctx, {
      type:'line',
      data:{
        labels: Array.from({length:14},(_,i)=>''),

/*  MODELOS CIENTÍFICOS PROBADOS - CORE CALCULATIONS                                      */
/* ══════════════════════════════════════════════════════════════════════════════════════ */

/**
 * MODELO 1: Cálculo de TMB (Tasa Metabólica Basal)
 * Fórmula: Mifflin-St Jeor (la más precisa según investigación)
 */
const calculateTMB = (weight, height, age, sex) => {
  if(sex === "M") {
    return 10 * weight + 6.25 * height - 5 * age + 5;
  } else {
    return 10 * weight + 6.25 * height - 5 * age - 161;
  }
};

/**
 * MODELO 2: Cálculo de TDEE (Gasto Energético Total Diario)
 * Multiplica TMB por factor de actividad
 */
const calculateTDEE = (tmb, activityLevel) => {
  const factors = {
    sedentary: 1.2,      // Sin ejercicio
    light: 1.375,        // 1-3 días/semana
    moderate: 1.55,      // 3-5 días/semana
    active: 1.725,       // 6-7 días/semana
    veryActive: 1.9      // Entrenamiento intenso diario
  };
  return tmb * (factors[activityLevel] || 1.55);
};

/**
 * MODELO 3: Cálculo de calorías objetivo CON AJUSTES DINÁMICOS
 * Incluye protección de masa muscular y predicciones
 */
const calculateCalorieGoal = (tdee, objective, weight, weeklyWeightChange = null) => {
  let goal = tdee;
  let adjustedGoal = goal;
  
  switch(objective) {
    case "weightLoss":
      // Déficit inteligente: -300-500 kcal para 0.5kg/semana sostenible
      // Si hay estancamiento (peso no baja en 2 semanas), se ajusta automáticamente
      if(weeklyWeightChange !== null && weeklyWeightChange === 0) {
        adjustedGoal = Math.round(tdee * 0.92); // Ajusta -8% (reducción más agresiva)
      } else {
        adjustedGoal = Math.round(tdee - 400); // -400 kcal por defecto
      }
      break;
      
    case "muscleGain":
      // Superávit controlado: +300-500 kcal para 0.5kg/semana
      // Más alto que el original (+10%), basado en estudios de composición corporal
      adjustedGoal = Math.round(tdee + 400); // +400 kcal por defecto
      break;
      
    default: // maintenance
      adjustedGoal = Math.round(tdee);
  }
  
  return { goal: adjustedGoal, tdee: Math.round(tdee) };
};

/**
 * MODELO 4: Distribución de macronutrientes PERSONALIZADA POR OBJETIVO
 * Basado en investigación de composición corporal y rendimiento
 */
const calculateMacroTargets = (calories, objective, weight) => {
  let proteinRatio, carbRatio, fatRatio;
  
  switch(objective) {
    case "weightLoss":
      // Máxima proteína para preservar músculo durante déficit
      // Proteína: 2.2g/kg (máximo recomendado)
      // Grasas: 25% (mínimo saludable para hormonas)
      // Carbos: el resto
      const proteinLossG = Math.min(weight * 2.2, (calories * 0.40) / 4); // Max 40% calorías
      const fatLossG = (calories * 0.25) / 9;
      const carbLossG = (calories - (proteinLossG * 4 + fatLossG * 9)) / 4;
      return {
        protein: Math.round(proteinLossG),
        carbs: Math.round(carbLossG),
        fat: Math.round(fatLossG),
        proteinPercent: 40,
        carbPercent: 35,
        fatPercent: 25
      };
      
    case "muscleGain":
      // Ganancia de masa: suficiente proteína y carbos para entrenamiento
      // Proteína: 2.0g/kg (suficiente para síntesis proteica)
      // Carbos: 55% (energía para entrenamiento)
      // Grasas: 25%
      const proteinGainG = Math.min(weight * 2.0, (calories * 0.35) / 4);
      const fatGainG = (calories * 0.25) / 9;
      const carbGainG = (calories - (proteinGainG * 4 + fatGainG * 9)) / 4;
      return {
        protein: Math.round(proteinGainG),
        carbs: Math.round(carbGainG),
        fat: Math.round(fatGainG),
        proteinPercent: 35,
        carbPercent: 55,
        fatPercent: 25
      };
      
    default: // maintenance
      // Balance: 1.6g/kg proteína, distribución equilibrada
      const proteinMainG = Math.min(weight * 1.6, (calories * 0.30) / 4);
      const fatMainG = (calories * 0.30) / 9;
      const carbMainG = (calories - (proteinMainG * 4 + fatMainG * 9)) / 4;
      return {
        protein: Math.round(proteinMainG),
        carbs: Math.round(carbMainG),
        fat: Math.round(fatMainG),
        proteinPercent: 30,
        carbPercent: 45,
        fatPercent: 25
      };
  }
};

/**
 * MODELO 5: Predictor de resultados
 * Calcula cuándo el usuario alcanzará su meta basado en progreso
 */
const predictGoalDate = (currentWeight, goalWeight, weightHistory, objective) => {
  const recentWeights = weightHistory.filter(w => w !== null).slice(-14);
  if(recentWeights.length < 7) return null; // Necesita al menos 7 puntos de datos
  
  const avgWeeklyChange = (recentWeights[recentWeights.length - 1] - recentWeights[0]) / 2; // 2 semanas
  if(avgWeeklyChange === 0) return null; // Estancado
  
  const kgsToGo = goalWeight - currentWeight;
  const weeksNeeded = Math.abs(kgsToGo / avgWeeklyChange);
  const targetDate = new Date();
  targetDate.setDate(targetDate.getDate() + weeksNeeded * 7);
  
  return { date: targetDate, weeks: Math.round(weeksNeeded), weeklyChange: rnd(avgWeeklyChange) };
};

/**
 * MODELO 6: Detección de mesetas inteligente
 * Identifica si el usuario está estancado
 */
const detectPlateau = (weightHistory) => {
  const recentWeights = weightHistory.filter(w => w !== null).slice(-14);
  if(recentWeights.length < 14) return false;
  
  const variance = recentWeights.reduce((sum, w) => sum + Math.pow(w - recentWeights[0], 2)) / recentWeights.length;
  return variance < 0.01; // Menos de 0.1kg de variación en 2 semanas
};

/**
 * MODELO 7: Integración de calorías quemadas en ejercicio
 * Sistema simple pero efectivo
 */
const calculateExerciseCalories = (activity, duration, weight) => {
  const mets = {
    walking: 3.5,
    running: 9.8,
    cycling: 8,
    swimming: 8,
    weightlifting: 6,
    hiit: 12,
    yoga: 3,
    cardio: 7
  };
  
  const met = mets[activity] || 5;
  const calories = Math.round((met * weight * duration) / 60);
  return calories;
};

  { id:201,n:"Pizza (2 slices mediano)",     cal:570,pro:24, car:66, fat:22, u:"pl", cat:"🍔 Comida rápida",base:300 },
  { id:202,n:"Hot dog",                      cal:290,pro:10, car:27, fat:16, u:"un", cat:"🍔 Comida rápida",base:95 },
  { id:203,n:"Papas fritas (mediano)",       cal:365,pro:4,  car:48, fat:17, u:"pl", cat:"🍔 Comida rápida",base:111 },
];

/* ────────────────────────────────────────────────────────────────────────────────── */
function App() {
  const [tab, setTab] = useState("hoy");
  const [date, setDate] = useState(t0());
  const [goal, setGoal] = useState(2000);
  const [macroTargets, setMacroTargets] = useState({protein:150,carbs:275,fat:67,proteinPercent:30,carbPercent:45,fatPercent:25});
  const [modal, setModal] = useState(null);
  const [query, setQuery] = useState("");
  const [selFood, setSelFood] = useState(null);
  const [amount, setAmount] = useState(100);
  const [meal, setMeal] = useState("Desayuno");
  const [log, setLog] = useState(()=>JSON.parse(localStorage.getItem("cal_log2")||"{}"));
  const [customDB, setCustomDB] = useState(()=>JSON.parse(localStorage.getItem("cal_custom")||"[]"));
  const [detEntry, setDetEntry] = useState(null);
  const [newFood, setNewFood] = useState({n:"",cal:"",pro:"",car:"",fat:"",cat:"⭐ Mis alimentos",u:"g"});
  const [userProfile, setUserProfile] = useState(()=>JSON.parse(localStorage.getItem("cal_profile")||JSON.stringify({weight:70,height:170,age:30,sex:"M",activityLevel:"moderate",objective:"maintenance",goalWeight:70})));
  const [water, setWaterState] = useState(8);
  const [waterGoal] = useState(8);
  const [searchRef] = useState(useRef(null));
  const [timerRunning, setTimerRunning] = useState(false);
  const [timerTime, setTimerTime] = useState(0);
  const timerRef = useRef(null);

  useEffect(()=>{
    if(timerRunning) {
      timerRef.current = setInterval(()=>setTimerTime(t=>t+1), 1000);
    } else {
      if(timerRef.current) clearInterval(timerRef.current);
    }
    return ()=>{if(timerRef.current) clearInterval(timerRef.current);};
  },[timerRunning]);

  const DB = useMemo(()=>[...DB_BASE,...customDB],[customDB]);

  /* ──────────────────────────────────────────────────────────────────── */
  /*  RECÁLCULO INTELIGENTE DE METAS CON MODELOS CIENTÍFICOS             */
  /* ──────────────────────────────────────────────────────────────────── */
  const recalculateGoal = (profile) => {
    const {weight, height, age, sex, activityLevel, objective, goalWeight} = profile;
    
    // Modelo 1: Calcular TMB
    const tmb = calculateTMB(weight, height, age, sex);
    
    // Modelo 2: Calcular TDEE
    const tdee = calculateTDEE(tmb, activityLevel);
    
    // Detectar estancamiento si hay histórico
    const weightHistory = Array.from({length:14},(_,i)=>{
      const d=ad(t0(),-13+i), k=dk(d);
      return (log[k]?.weight) ? Number(log[k].weight) : null;
    });
    const isPlateaued = detectPlateau(weightHistory);
    
    // Modelo 3: Calcular calorías objetivo con ajustes dinámicos
    const { goal: adjustedGoal, tdee: tdeeRounded } = calculateCalorieGoal(tdee, objective, weight, isPlateaued ? 0 : null);
    
    // Modelo 4: Calcular macros personalizados por objetivo
    const macros = calculateMacroTargets(adjustedGoal, objective, weight);
    
    setGoal(adjustedGoal);
    setMacroTargets(macros);
    localStorage.setItem("cal_goal", adjustedGoal);
    localStorage.setItem("cal_macros", JSON.stringify(macros));
  };

  useEffect(()=>{
    recalculateGoal(userProfile);
  },[userProfile]);

  const saveLog = l => { setLog(l); localStorage.setItem("cal_log2",JSON.stringify(l)); };
  const saveCustom = c => { setCustomDB(c); localStorage.setItem("cal_custom",JSON.stringify(c)); };

  const dateKey = dk(date);
  const dayData = log[dateKey] || { entries:[], water:0, weight:null };
  const entries = dayData.entries || [];
  const weightVal = dayData.weight || "";

  const updateDay = (patch) => {
    const updated = {...log, [dateKey]: {...dayData, ...patch}};
    saveLog(updated);
  };

  const totals = useMemo(()=>entries.reduce((a,e)=>({
    cal:a.cal+e.cal, pro:a.pro+e.pro, car:a.car+e.car, fat:a.fat+e.fat
  }),{cal:0,pro:0,car:0,fat:0}),[entries]);

  const filtered = useMemo(()=>{
    if(!query.trim()) return [];
    const q=query.toLowerCase();
    return DB.filter(f=>f.n.toLowerCase().includes(q)).slice(0,14);
  },[query,DB]);

  const selectFood = f => { setSelFood(f); setAmount(f.base||100); setQuery(f.n); };

  const calcEntry = (food,amt) => {
    const base=food.base||100, factor=amt/base;
    return { id:Date.now().toString(), foodId:food.id, name:food.n, meal, amount:amt, unit:food.u,
      cal:Math.round(food.cal*factor), pro:rnd(food.pro*factor),
      car:rnd(food.car*factor), fat:rnd(food.fat*factor) };
  };

  const addEntry = () => {
    if(!selFood) return;
    updateDay({ entries:[...entries, calcEntry(selFood,amount)] });
    setModal(null); setQuery(""); setSelFood(null); setAmount(100);
  };

  const removeEntry = id => {
    updateDay({ entries: entries.filter(e=>e.id!==id) });
    setDetEntry(null); setModal(null);
  };

  const setWater = n => updateDay({ water: Math.max(0,Math.min(n,20)) });
  const setWeightVal = v => updateDay({ weight: v });

  const weightHistory = useMemo(()=>Array.from({length:14},(_,i)=>{
    const d=ad(t0(),-13+i), k=dk(d);
    return (log[k]?.weight) ? Number(log[k].weight) : null;
  }),[log]);

  const calHistory = useMemo(()=>Array.from({length:7},(_,i)=>{
    const d=ad(t0(),-6+i), k=dk(d);
    const ents=log[k]?.entries||[];
    return { d, k, cal:ents.reduce((s,e)=>s+e.cal,0) };
  }),[log]);

  const saveNewFood = () => {
    const {n,cal,pro,car,fat,cat,u} = newFood;
    if(!n.trim()||!cal) { alert("Nombre y calorías son obligatorios"); return; }
    const food = { id:"c"+Date.now(), n:n.trim(), cal:Number(cal), pro:Number(pro)||0,
      car:Number(car)||0, fat:Number(fat)||0, cat, u, custom:true };
    saveCustom([...customDB, food]);
    setNewFood({n:"",cal:"",pro:"",car:"",fat:"",cat:"⭐ Mis alimentos",u:"g"});
    setModal("add");
  };

  const deleteCustom = id => {
    if(!confirm("¿Eliminar este alimento de tu lista?")) return;
    saveCustom(customDB.filter(f=>f.id!==id));
  };

  const pct = totals.cal/goal;
  const rem = goal - Math.round(totals.cal);

  // Modelo 5: Predicción de resultados
  const prediction = useMemo(() => {
    const w = Number(weightVal);
    const gw = userProfile.goalWeight;
    if(!w || !gw || w === gw) return null;
    return predictGoalDate(w, gw, weightHistory, userProfile.objective);
  }, [weightVal, userProfile, weightHistory]);

  // Modelo 6: Detección de meseta
  const isPlateau = useMemo(() => detectPlateau(weightHistory), [weightHistory]);

  const openAdd = m => {
    setMeal(m||"Desayuno"); setModal("add");
    setTimeout(()=>searchRef.current?.focus(),120);
  };

  return (
    <div style={{minHeight:"100vh",background:"#F2F7F4"}}>

      {/* TOPBAR */}
      <div style={{background:GREEN,color:"#fff",padding:"12px 16px 0"}}>
        <div style={{fontSize:10,opacity:.7,letterSpacing:".1em",textTransform:"uppercase"}}>NUTRIPEAK v2.0</div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:2,marginBottom:10,gap:8}}>
          <button onClick={()=>setModal("goal")} style={{background:"rgba(255,255,255,.2)",border:"none",borderRadius:99,padding:"4px 12px",color:"#fff",fontSize:12}}>
            Meta: {goal} kcal
          </button>
          <div style={{fontSize:15,fontWeight:700}}>Mi registro diario</div>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>setModal("feedback")} style={{background:"rgba(255,255,255,.2)",border:"none",borderRadius:99,padding:"4px 10px",color:"#fff",fontSize:12,cursor:"pointer"}}>
              💬 Feedback
            </button>
            <button onClick={()=>setModal("creditos")} style={{background:"rgba(255,255,255,.2)",border:"none",borderRadius:99,padding:"4px 10px",color:"#fff",fontSize:12,cursor:"pointer"}}>
              ℹ️ Info
            </button>
          </div>
        </div>
        <div style={{display:"flex",gap:4}}>
          {[["hoy","Hoy"],["historial","Historial"],["mis","Mis alimentos"],["analisis","Análisis"]].map(([k,l])=>(
            <button key={k} onClick={()=>setTab(k)} style={{
              background:tab===k?"rgba(255,255,255,.25)":"transparent",
              border:"none",borderRadius:"8px 8px 0 0",padding:"6px 14px",
              color:"#fff",fontSize:12,fontWeight:tab===k?700:400
            }}>{l}</button>
          ))}
        </div>
      </div>

      {/* ══════ TAB HOY ══════ */}
      {tab==="hoy" && (
        <div style={{padding:14}}>

          {/* Nav fecha */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
            <button onClick={()=>setDate(d=>ad(d,-1))} style={{background:"#fff",border:"1px solid #ddd",borderRadius:8,padding:"6px 12px",fontSize:14}}>‹</button>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:14,fontWeight:600}}>{fmt(date)}</div>
              {dk(date)===dk(t0())&&<div style={{fontSize:11,color:GREEN,fontWeight:600}}>Hoy</div>}
            </div>
            <button onClick={()=>setDate(d=>ad(d,1))} disabled={dk(date)===dk(t0())}
              style={{background:"#fff",border:"1px solid #ddd",borderRadius:8,padding:"6px 12px",fontSize:14,opacity:dk(date)===dk(t0())?.3:1}}>›</button>
          </div>

          {/* Resumen calorías */}
          <div style={{background:"#fff",borderRadius:16,padding:16,marginBottom:12,display:"flex",alignItems:"center",gap:14,boxShadow:"0 1px 8px rgba(0,0,0,.07)"}}>
            <Ring pct={pct} label={Math.round(totals.cal)} sub="kcal"/>
            <div style={{flex:1}}>
              <div style={{fontSize:12,color:"#555",marginBottom:8}}>
                {rem>=0
                  ? <><span style={{fontWeight:700,color:GREEN}}>{rem}</span> kcal restantes</>
                  : <><span style={{fontWeight:700,color:"#EF4444"}}>{Math.abs(rem)}</span> kcal sobre meta</>}
              </div>
              <MacroBar label="Proteínas" val={totals.pro} max={macroTargets.protein} color="#3B82F6"/>
              <MacroBar label="Carbohidratos" val={totals.car} max={macroTargets.carbs} color="#F97316"/>
              <MacroBar label="Grasas" val={totals.fat} max={macroTargets.fat} color="#8B5CF6"/>
            </div>
          </div>

          {/* ALERTAS INTELIGENTES */}
          {isPlateau && (
            <div style={{background:"#FEF3C7",borderLeft:`4px solid #F59E0B`,borderRadius:8,padding:12,marginBottom:12,fontSize:13}}>
              <div style={{fontWeight:600,color:"#78350F",marginBottom:4}}>⚠️ Meseta detectada</div>
              <div style={{color:"#92400E",fontSize:12}}>Tu peso no ha cambiado en 2 semanas. Considera ajustar tu déficit calórico en -5% o aumentar actividad.</div>
            </div>
          )}

          {prediction && (
            <div style={{background:"#DBEAFE",borderLeft:`4px solid ${BLUE}`,borderRadius:8,padding:12,marginBottom:12}}>
              <div style={{fontWeight:600,color:"#1E40AF",marginBottom:4}}>🎯 Predicción de meta</div>
              <div style={{color:"#1E3A8A",fontSize:12}}>
                En <strong>{prediction.weeks} semanas</strong> (aprox. {prediction.date.toLocaleDateString('es-CL')}) llegarás a {userProfile.goalWeight}kg 
                <br/><small>(Cambio semanal: {prediction.weeklyChange>0?'+':''}{prediction.weeklyChange}kg)</small>
              </div>
            </div>
          )}

          {/* Agua + Peso */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>

            {/* AGUA */}
            <div style={{background:"#fff",borderRadius:14,padding:14,boxShadow:"0 1px 6px rgba(0,0,0,.06)"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                <div>
                  <div style={{fontSize:11,color:"#888"}}>Agua</div>
                  <div style={{fontSize:17,fontWeight:700,color:BLUE}}>{water}<span style={{fontSize:11,fontWeight:400,color:"#aaa"}}>/{waterGoal}</span></div>
                  <div style={{fontSize:10,color:"#aaa"}}>{water*250} ml</div>
                </div>
                <div style={{fontSize:28}}>💧</div>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:10}}>
                {Array.from({length:waterGoal},(_,i)=>(
                  <button key={i} onClick={()=>setWater(i<water?i:i+1)}
                    style={{width:28,height:28,borderRadius:6,border:"none",fontSize:16,
                      background:i<water?LBLUE:"#f5f5f5",cursor:"pointer",
                      transition:"background .15s"}}>
                    {i<water?"💧":"○"}
                  </button>
                ))}
              </div>
              <div style={{display:"flex",gap:4}}>
                <button onClick={()=>setWater(water-1)} style={{flex:1,padding:"5px 0",background:"#f5f5f5",border:"none",borderRadius:7,fontSize:16,color:BLUE}}>−</button>
                <button onClick={()=>setWater(water+1)} style={{flex:1,padding:"5px 0",background:LBLUE,border:"none",borderRadius:7,fontSize:16,color:BLUE}}>+</button>
              </div>
            </div>

            {/* PESO */}
            <div style={{background:"#fff",borderRadius:14,padding:14,boxShadow:"0 1px 6px rgba(0,0,0,.06)"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                <div>
                  <div style={{fontSize:11,color:"#888"}}>Peso corporal</div>
                  <div style={{fontSize:17,fontWeight:700,color:GREEN}}>
                    {weightVal||"—"}<span style={{fontSize:11,fontWeight:400,color:"#aaa"}}> kg</span>
                  </div>
                </div>
                <div style={{fontSize:28}}>⚖️</div>
              </div>
              <input type="number" value={weightVal} step="0.1" min="30" max="300"
                placeholder="ej: 78.5"
                onChange={e=>setWeightVal(e.target.value)}
                style={{marginBottom:8,textAlign:"center",fontWeight:700,fontSize:15,color:GREEN}}/>
              <div style={{overflow:"hidden"}}>
                <WeightChart data={weightHistory}/>
                <div style={{fontSize:9,color:"#ccc",marginTop:2}}>Últimas 2 semanas</div>
              </div>
            </div>
          </div>

          {/* Registro por comida */}
          {MEALS.map(m=>{
            const mE=entries.filter(e=>e.meal===m);
            const mC=mE.reduce((s,e)=>s+e.cal,0);
            return (
              <div key={m} style={{background:"#fff",borderRadius:14,marginBottom:10,overflow:"hidden",boxShadow:"0 1px 6px rgba(0,0,0,.06)"}}>
                <div style={{padding:"10px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:mE.length?"1px solid #f5f5f5":"none"}}>
                  <div>
                    <div style={{fontSize:13,fontWeight:600}}>{m}</div>
                    {mC>0&&<div style={{fontSize:11,color:"#999"}}>{Math.round(mC)} kcal</div>}
                  </div>
                  <button onClick={()=>openAdd(m)} style={{background:LGREEN,border:"none",borderRadius:8,padding:"5px 12px",color:GREEN,fontSize:13,fontWeight:600}}>+ Agregar</button>
                </div>
                {mE.map(e=>(
                  <div key={e.id} onClick={()=>{setDetEntry(e);setModal("detail");}}
                    style={{padding:"8px 14px",borderBottom:"1px solid #fafafa",display:"flex",alignItems:"center",gap:10,cursor:"pointer"}}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13}}>{e.name}</div>
                      <div style={{fontSize:11,color:"#bbb"}}>{e.amount}{["g","ml"].includes(e.unit)?e.unit:""} · P:{e.pro}g C:{e.car}g G:{e.fat}g</div>
                    </div>
                    <div style={{fontWeight:700,color:GREEN,fontSize:14}}>{e.cal}</div>
                    <div style={{fontSize:11,color:"#ccc"}}>kcal</div>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      )}

      {/* ══════ TAB HISTORIAL ══════ */}
      {tab==="historial" && (
        <div style={{padding:14}}>
          {/* Calorías */}
          <div style={{background:"#fff",borderRadius:16,padding:16,marginBottom:12,boxShadow:"0 1px 8px rgba(0,0,0,.07)"}}>
            <div style={{fontSize:13,fontWeight:600,marginBottom:12}}>Calorías — últimos 7 días</div>
            {calHistory.map(({d,k,cal})=>(
              <div key={k} onClick={()=>{setDate(d);setTab("hoy");}}
                style={{display:"flex",alignItems:"center",gap:12,padding:"9px 0",borderBottom:"1px solid #f8f8f8",cursor:"pointer"}}>
                <div style={{width:44,fontSize:12}}>
                  <div style={{fontWeight:dk(d)===dk(t0())?700:400,color:dk(d)===dk(t0())?GREEN:"#333"}}>{DAYS[d.getDay()]}</div>
                  <div style={{fontSize:10,color:"#bbb"}}>{d.getDate()}/{d.getMonth()+1}</div>
                </div>
                <div style={{flex:1,height:8,background:"#eee",borderRadius:99,overflow:"hidden"}}>
                  <div style={{height:"100%",width:`${Math.min(cal/goal,1)*100}%`,background:cal>goal?"#EF4444":GREEN,borderRadius:99}}/>
                </div>
                <div style={{fontSize:13,fontWeight:600,color:cal>goal?"#EF4444":"#333",minWidth:72,textAlign:"right"}}>
                  {cal>0?`${Math.round(cal)} kcal`:<span style={{color:"#ddd",fontWeight:400}}>—</span>}
                </div>
              </div>
            ))}
            <div style={{marginTop:12,background:"#F2F7F4",borderRadius:10,padding:"10px 12px",display:"flex",justifyContent:"space-between"}}>
              <div style={{fontSize:12,color:"#555"}}>Promedio</div>
              <div style={{fontSize:15,fontWeight:700,color:GREEN}}>
                {Math.round(calHistory.filter(h=>h.cal>0).reduce((s,h)=>s+h.cal,0)/Math.max(calHistory.filter(h=>h.cal>0).length,1))||0} kcal
              </div>
            </div>
          </div>

          {/* Peso histórico */}
          <div style={{background:"#fff",borderRadius:16,padding:16,marginBottom:12,boxShadow:"0 1px 8px rgba(0,0,0,.07)"}}>
            <div style={{fontSize:13,fontWeight:600,marginBottom:12}}>Peso — últimas 2 semanas</div>
            <WeightChart data={weightHistory}/>
            <div style={{marginTop:12,display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,fontSize:12}}>
              <div style={{background:"#f9f9f9",borderRadius:10,padding:12}}>
                <div style={{color:"#666",marginBottom:4}}>Inicial</div>
                <div style={{fontSize:18,fontWeight:700,color:GREEN}}>{weightHistory.filter(w=>w!==null)[0]||"—"} kg</div>
              </div>
              <div style={{background:"#f9f9f9",borderRadius:10,padding:12}}>
                <div style={{color:"#666",marginBottom:4}}>Actual</div>
                <div style={{fontSize:18,fontWeight:700,color:GREEN}}>{weightHistory.filter(w=>w!==null).pop()||"—"} kg</div>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ══════ TAB ANÁLISIS (NUEVO) ══════ */}
      {tab==="analisis" && (
        <div style={{padding:14}}>
          <div style={{background:"#fff",borderRadius:16,padding:16,marginBottom:12,boxShadow:"0 1px 8px rgba(0,0,0,.07)"}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:16}}>📊 Análisis Nutricional</div>
            
            <div style={{marginBottom:14,borderBottom:"1px solid #f0f0f0",paddingBottom:14}}>
              <div style={{fontSize:12,fontWeight:600,color:"#666",marginBottom:8}}>Objetivos personalizados</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,fontSize:13}}>
                <div style={{background:"#F0F9FF",borderRadius:10,padding:12}}>
                  <div style={{color:"#666",marginBottom:4,fontSize:11}}>Proteína</div>
                  <div style={{fontSize:16,fontWeight:700,color:"#3B82F6"}}>{macroTargets.protein}g</div>
                  <div style={{fontSize:10,color:"#999"}}>{macroTargets.proteinPercent}% calorías</div>
                </div>
                <div style={{background:"#FEF3C7",borderRadius:10,padding:12}}>
                  <div style={{color:"#666",marginBottom:4,fontSize:11}}>Carbohidratos</div>
                  <div style={{fontSize:16,fontWeight:700,color:"#F97316"}}>{macroTargets.carbs}g</div>
                  <div style={{fontSize:10,color:"#999"}}>{macroTargets.carbPercent}% calorías</div>
                </div>
                <div style={{background:"#F3E8FF",borderRadius:10,padding:12}}>
                  <div style={{color:"#666",marginBottom:4,fontSize:11}}>Grasas</div>
                  <div style={{fontSize:16,fontWeight:700,color:"#8B5CF6"}}>{macroTargets.fat}g</div>
                  <div style={{fontSize:10,color:"#999"}}>{macroTargets.fatPercent}% calorías</div>
                </div>
                <div style={{background:"#DCFCE7",borderRadius:10,padding:12}}>
                  <div style={{color:"#666",marginBottom:4,fontSize:11}}>Meta diaria</div>
                  <div style={{fontSize:16,fontWeight:700,color:GREEN}}>{goal}kcal</div>
                  <div style={{fontSize:10,color:"#999"}}>Objetivo: {userProfile.objective}</div>
                </div>
              </div>
            </div>

            <div style={{marginBottom:14,borderBottom:"1px solid #f0f0f0",paddingBottom:14}}>
              <div style={{fontSize:12,fontWeight:600,color:"#666",marginBottom:8}}>Datos del perfil</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,fontSize:13}}>
                <div><span style={{color:"#999"}}>Peso:</span> <strong>{userProfile.weight}kg</strong></div>
                <div><span style={{color:"#999"}}>Altura:</span> <strong>{userProfile.height}cm</strong></div>
                <div><span style={{color:"#999"}}>Edad:</span> <strong>{userProfile.age} años</strong></div>
                <div><span style={{color:"#999"}}>Sexo:</span> <strong>{userProfile.sex==="M"?"Masculino":"Femenino"}</strong></div>
                <div><span style{{color:"#999"}}>Actividad:</span> <strong>{userProfile.activityLevel}</strong></div>
                <div><span style={{color:"#999"}}>Meta:</span> <strong>{userProfile.goalWeight}kg</strong></div>
              </div>
            </div>

            <div style={{background:"#ECFDF5",borderRadius:10,padding:12,fontSize:12,lineHeight:1.6,color:"#065F46"}}>
              <div style={{fontWeight:600,marginBottom:6}}>💡 Información importante</div>
              <ul style={{marginLeft:20,marginTop:6}}>
                <li>Los macros se calculan automáticamente según tu objetivo</li>
                <li>Si no hay progreso en 2 semanas, NUTRIPEAK sugiere ajustar calorías</li>
                <li>Proteína alta preserva masa muscular en déficit</li>
                <li>Los carbos varían según actividad y objetivo</li>
              </ul>
            </div>
          </div>
        </div>
      )}

      {/* ══════ TAB MIS ALIMENTOS ══════ */}
      {tab==="mis" && (
        <div style={{padding:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <div style={{fontSize:15,fontWeight:700}}>Alimentos personalizados</div>
            <button onClick={()=>setModal("nuevo")} style={{background:GREEN,color:"#fff",border:"none",borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:600}}>+ Nuevo</button>
          </div>

          {customDB.length===0
            ? <div style={{textAlign:"center",padding:"30px 0",color:"#bbb"}}><div style={{fontSize:14}}>Sin alimentos personalizados</div><div style={{fontSize:12}}>Crea tu primer alimento haciendo clic en "+ Nuevo"</div></div>
            : <div style={{background:"#fff",borderRadius:14,boxShadow:"0 1px 6px rgba(0,0,0,.06)",overflow:"hidden"}}>
                {customDB.map(f=>(
                  <div key={f.id} style={{padding:"12px 14px",borderBottom:"1px solid #f5f5f5",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontSize:13,fontWeight:600}}>{f.n}</div>
                      <div style={{fontSize:11,color:"#999"}}>{f.cal}kcal · P:{f.pro}g C:{f.car}g G:{f.fat}g</div>
                    </div>
                    <button onClick={()=>deleteCustom(f.id)} style={{background:"#fee2e2",color:"#991b1b",border:"none",borderRadius:6,padding:"4px 8px",fontSize:11,cursor:"pointer"}}>Eliminar</button>
                  </div>
                ))}
              </div>
          }
        </div>
      )}

      {/* ══════ MODAL DETALLE ══════ */}
      {modal==="detail" && detEntry && (
        <div onClick={()=>setModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:20}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,padding:20,width:"100%",maxWidth:320}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:12}}>{detEntry.name}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
              {[["Calorías",detEntry.cal,"kcal","#2D9C6B"],["Proteínas",detEntry.pro,"g","#3B82F6"],["Carbos",detEntry.car,"g","#F97316"],["Grasas",detEntry.fat,"g","#8B5CF6"]].map(([l,v,u,c])=>(
                <div key={l} style={{background:c+"15",borderRadius:10,padding:10,textAlign:"center"}}>
                  <div style={{fontSize:18,fontWeight:700,color:c}}>{v}</div>
                  <div style={{fontSize:10,color:"#999"}}>{l}</div>
                </div>
              ))}
            </div>
            <button onClick={()=>removeEntry(detEntry.id)} style={{width:"100%",padding:11,background:"#FEE2E2",color:"#991B1B",border:"none",borderRadius:10,fontWeight:700,fontSize:13,cursor:"pointer"}}>Eliminar entrada</button>
          </div>
        </div>
      )}

      {/* ══════ MODAL AGREGAR ══════ */}
      {modal==="add" && (
        <div onClick={()=>setModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:1100,padding:20}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:20,width:"100%",maxWidth:480,maxHeight:"80vh",overflowY:"auto"}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:10}}>Agregar alimento</div>
            <div style={{fontSize:12,color:"#999",marginBottom:12}}>{meal}</div>

            <div style={{position:"relative",marginBottom:8}}>
              <input ref={searchRef} value={query} onChange={e=>{setQuery(e.target.value);setSelFood(null);}}
                placeholder="Buscar alimento... (ej: pollo, arroz, manzana)"/>
              {query&&<button onClick={()=>{setQuery("");setSelFood(null);}} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",fontSize:18,color:"#bbb"}}>×</button>}
            </div>

            {!selFood && filtered.length>0 && (
              <div style={{flex:1,overflowY:"auto",border:"1px solid #eee",borderRadius:10,marginBottom:10}}>
                {filtered.map(f=>(
                  <div key={f.id} onClick={()=>selectFood(f)} style={{padding:"9px 12px",borderBottom:"1px solid #f8f8f8",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontSize:13}}>{f.n}{f.custom&&<span style={{fontSize:10,background:LGREEN,color:GREEN,borderRadius:4,padding:"1px 5px",marginLeft:5}}>mío</span>}</div>
                      <div style={{fontSize:10,color:"#bbb"}}>{f.cat} · {f.cal} kcal/{f.base?`1 ${f.u}`:`100${f.u}`}</div>
                    </div>
                    <div style={{fontWeight:700,color:GREEN}}>{f.cal}</div>
                  </div>
                ))}
              </div>
            )}
            {!selFood && query.length>1 && filtered.length===0 && (
              <div style={{textAlign:"center",padding:"16px 0",color:"#bbb",fontSize:13}}>
                Sin resultados · <button onClick={()=>setModal("nuevo")} style={{background:"none",border:"none",color:GREEN,fontWeight:600,fontSize:13,cursor:"pointer"}}>Crear "{query}"</button>
              </div>
            )}

            {selFood && (
              <div style={{marginBottom:10}}>
                <div style={{background:LGREEN,borderRadius:10,padding:"10px 14px",marginBottom:10}}>
                  <div style={{fontSize:13,fontWeight:600}}>{selFood.n}</div>
                  <div style={{fontSize:11,color:"#888"}}>{selFood.cat}</div>
                </div>
                <label style={{fontSize:12,color:"#666",display:"block",marginBottom:4}}>
                  Cantidad ({selFood.u==="un"?"unidades":selFood.u==="pl"?"g (porción)":selFood.u})
                </label>
                <input type="number" value={amount} min={1} step={selFood.u==="un"?1:5}
                  onChange={e=>setAmount(Number(e.target.value))} style={{textAlign:"center",fontSize:20,fontWeight:700,marginBottom:8}}/>
                {(()=>{
                  const p=calcEntry(selFood,amount);
                  return (
                    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:4,textAlign:"center",background:"#f9f9f9",borderRadius:10,padding:10}}>
                      {[["Calorías",p.cal,"kcal",GREEN],["Prot.",p.pro,"g","#3B82F6"],["Carbs",p.car,"g","#F97316"],["Grasas",p.fat,"g","#8B5CF6"]].map(([l,v,u,c])=>(
                        <div key={l}><div style={{fontSize:16,fontWeight:700,color:c}}>{v}</div><div style={{fontSize:9,color:"#aaa"}}>{l}</div></div>
                      ))}
                    </div>
                  );
                })()}
              </div>
            )}

            <div style={{display:"flex",gap:4,marginTop:8}}>
              <button onClick={()=>setModal("nuevo")} style={{flex:1,padding:11,background:"#f0fdf4",color:GREEN,border:`1px solid ${GREEN}`,borderRadius:10,fontSize:13,fontWeight:600}}>+ Crear alimento</button>
              <button onClick={addEntry} disabled={!selFood} style={{flex:2,padding:11,background:selFood?GREEN:"#ccc",color:"#fff",border:"none",borderRadius:10,fontSize:14,fontWeight:700}}>Agregar</button>
            </div>
          </div>
        </div>
      )}

      {/* ══════ MODAL NUEVO ALIMENTO ══════ */}
      {modal==="nuevo" && (
        <div onClick={()=>setModal("add")} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:1100}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:20,width:"100%",maxWidth:480,maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:4}}>Crear alimento personalizado</div>
            <div style={{fontSize:12,color:"#888",marginBottom:14}}>Los valores son por 100g o por unidad según corresponda.</div>

            <div style={{marginBottom:10}}>
              <label style={{fontSize:12,color:"#666",display:"block",marginBottom:3}}>Nombre *</label>
              <input value={newFood.n} onChange={e=>setNewFood(f=>({...f,n:e.target.value}))} placeholder="Ej: Wrap de pollo casero"/>
            </div>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
              <div>
                <label style={{fontSize:12,color:"#666",display:"block",marginBottom:3}}>Calorías (kcal) *</label>
                <input type="number" value={newFood.cal} onChange={e=>setNewFood(f=>({...f,cal:e.target.value}))} placeholder="ej: 250" style={{textAlign:"center"}}/>
              </div>
              <div>
                <label style={{fontSize:12,color:"#666",display:"block",marginBottom:3}}>Unidad</label>
                <select value={newFood.u} onChange={e=>setNewFood(f=>({...f,u:e.target.value}))}>
                  <option value="g">gramos (g)</option>
                  <option value="ml">mililitros (ml)</option>
                  <option value="un">unidades (un)</option>
                  <option value="pl">porción (pl)</option>
                </select>
              </div>
            </div>

            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:10}}>
              <div>
                <label style={{fontSize:12,color:"#666",display:"block",marginBottom:3}}>Proteínas (g)</label>
                <input type="number" value={newFood.pro} onChange={e=>setNewFood(f=>({...f,pro:e.target.value}))} placeholder="0" style={{textAlign:"center"}}/>
              </div>
              <div>
                <label style={{fontSize:12,color:"#666",display:"block",marginBottom:3}}>Carbos (g)</label>
                <input type="number" value={newFood.car} onChange={e=>setNewFood(f=>({...f,car:e.target.value}))} placeholder="0" style={{textAlign:"center"}}/>
              </div>
              <div>
                <label style={{fontSize:12,color:"#666",display:"block",marginBottom:3}}>Grasas (g)</label>
                <input type="number" value={newFood.fat} onChange={e=>setNewFood(f=>({...f,fat:e.target.value}))} placeholder="0" style={{textAlign:"center"}}/>
              </div>
            </div>

            <div style={{marginBottom:16}}>
              <label style={{fontSize:12,color:"#666",display:"block",marginBottom:3}}>Categoría</label>
              <select value={newFood.cat} onChange={e=>setNewFood(f=>({...f,cat:e.target.value}))}>
                <option value="⭐ Mis alimentos">⭐ Mis alimentos</option>
                <option value="🥩 Proteínas">🥩 Proteínas</option>
                <option value="🌾 Cereales">🌾 Cereales</option>
                <option value="🥦 Verduras">🥦 Verduras</option>
                <option value="🍎 Frutas">🍎 Frutas</option>
                <option value="🇨🇱 Cocina chilena">🇨🇱 Cocina chilena</option>
                <option value="🥤 Bebidas">🥤 Bebidas</option>
                <option value="🍫 Snacks">🍫 Snacks</option>
              </select>
            </div>

            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setModal("add")} style={{flex:1,padding:12,background:"#f5f5f5",color:"#555",border:"none",borderRadius:10,fontSize:13}}>Cancelar</button>
              <button onClick={saveNewFood} style={{flex:2,padding:12,background:GREEN,color:"#fff",border:"none",borderRadius:10,fontSize:14,fontWeight:700}}>Guardar alimento</button>
            </div>
          </div>
        </div>
      )}

      {/* ══════ MODAL META ══════ */}
      {modal==="goal" && (
        <div onClick={()=>setModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:20}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,padding:20,width:"100%",maxWidth:400,maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:14}}>Configurar metas personalizadas</div>

            {/* Perfil de usuario */}
            <div style={{background:"#f9f9f9",borderRadius:12,padding:14,marginBottom:14}}>
              <div style={{fontSize:13,fontWeight:600,color:"#333",marginBottom:10}}>Tus datos</div>
              
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                <div>
                  <label style={{fontSize:11,color:"#666",display:"block",marginBottom:4}}>Peso (kg)</label>
                  <input type="number" value={userProfile.weight} onChange={e=>{const p={...userProfile,weight:Number(e.target.value)}; setUserProfile(p); localStorage.setItem("cal_profile",JSON.stringify(p));}} style={{textAlign:"center",fontSize:14}}/>
                </div>
                <div>
                  <label style={{fontSize:11,color:"#666",display:"block",marginBottom:4}}>Altura (cm)</label>
                  <input type="number" value={userProfile.height} onChange={e=>{const p={...userProfile,height:Number(e.target.value)}; setUserProfile(p); localStorage.setItem("cal_profile",JSON.stringify(p));}} style={{textAlign:"center",fontSize:14}}/>
                </div>
              </div>

              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                <div>
                  <label style={{fontSize:11,color:"#666",display:"block",marginBottom:4}}>Edad</label>
                  <input type="number" value={userProfile.age} onChange={e=>{const p={...userProfile,age:Number(e.target.value)}; setUserProfile(p); localStorage.setItem("cal_profile",JSON.stringify(p));}} style={{textAlign:"center",fontSize:14}}/>
                </div>
                <div>
                  <label style={{fontSize:11,color:"#666",display:"block",marginBottom:4}}>Sexo</label>
                  <select value={userProfile.sex} onChange={e=>{const p={...userProfile,sex:e.target.value}; setUserProfile(p); localStorage.setItem("cal_profile",JSON.stringify(p));}} style={{textAlign:"center",fontSize:14}}>
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                  </select>
                </div>
              </div>
            </div>

            {/* Objetivo */}
            <div style={{background:"#f9f9f9",borderRadius:12,padding:14,marginBottom:14}}>
              <div style={{fontSize:13,fontWeight:600,color:"#333",marginBottom:10}}>Mi objetivo</div>
              
              <label style={{fontSize:11,color:"#666",display:"block",marginBottom:8}}>Actividad física</label>
              <select value={userProfile.activityLevel} onChange={e=>{const p={...userProfile,activityLevel:e.target.value}; setUserProfile(p); localStorage.setItem("cal_profile",JSON.stringify(p));}} style={{marginBottom:12}}>
                <option value="sedentary">Sedentario (sin ejercicio)</option>
                <option value="light">Ligero (1-3 días/semana)</option>
                <option value="moderate">Moderado (3-5 días/semana)</option>
                <option value="active">Activo (6-7 días/semana)</option>
                <option value="veryActive">Muy activo (entrenamiento intenso)</option>
              </select>

              <label style={{fontSize:11,color:"#666",display:"block",marginBottom:8}}>Objetivo</label>
              <select value={userProfile.objective} onChange={e=>{const p={...userProfile,objective:e.target.value}; setUserProfile(p); localStorage.setItem("cal_profile",JSON.stringify(p));}} style={{marginBottom:12}}>
                <option value="weightLoss">Pérdida de peso</option>
                <option value="maintenance">Mantenimiento</option>
                <option value="muscleGain">Ganancia de masa muscular</option>
              </select>

              <label style={{fontSize:11,color:"#666",display:"block",marginBottom:4}}>Meta de peso (kg)</label>
              <input type="number" value={userProfile.goalWeight} onChange={e=>{const p={...userProfile,goalWeight:Number(e.target.value)}; setUserProfile(p); localStorage.setItem("cal_profile",JSON.stringify(p));}} style={{textAlign:"center",fontSize:14}}/>
            </div>

            <button onClick={()=>setModal(null)} style={{width:"100%",padding:12,background:GREEN,color:"#fff",border:"none",borderRadius:10,fontSize:13,fontWeight:700}}>Guardar cambios</button>
          </div>
        </div>
      )}

      {/* ══════ MODAL FEEDBACK ══════ */}
      {modal==="feedback" && (
        <div onClick={()=>setModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:20}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,padding:20,width:"100%",maxWidth:400,maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:4}}>Feedback y soporte</div>
            <div style={{fontSize:12,color:"#888",marginBottom:14}}>¿Encontraste un error? ¿Una sugerencia?</div>

            <form action="https://formspree.io/f/xpqnywvp" method="POST" style={{display:"flex",flexDirection:"column",gap:12}}>
              <div>
                <label style={{fontSize:12,fontWeight:600,color:"#666",marginBottom:4,display:"block"}}>Nombre *</label>
                <input type="text" name="nombre" placeholder="Tu nombre" required style={{width:"100%",padding:9,borderRadius:8,border:"1px solid #e0e0e0",fontSize:13}}/>
              </div>

              <div>
                <label style={{fontSize:12,fontWeight:600,color:"#666",marginBottom:4,display:"block"}}>Email *</label>
                <input type="email" name="email" placeholder="tu@email.com" required style={{width:"100%",padding:9,borderRadius:8,border:"1px solid #e0e0e0",fontSize:13}}/>
              </div>

              <div>
                <label style={{fontSize:12,fontWeight:600,color:"#666",marginBottom:4,display:"block"}}>Mensaje *</label>
                <textarea name="mensaje" placeholder="Cuéntanos qué te gustaría mejorar..." required style={{width:"100%",minHeight:100,padding:10,borderRadius:8,border:"1px solid #e0e0e0",fontSize:13,fontFamily:"inherit",resize:"vertical"}}/>
              </div>

              <input type="hidden" name="_subject" value="Feedback NUTRIPEAK v2.0"/>
              <input type="hidden" name="_captcha" value="false"/>
              
              <div style={{display:"flex",gap:8}}>
                <button type="submit" style={{flex:1,padding:11,background:GREEN,color:"#fff",border:"none",borderRadius:10,fontWeight:700,fontSize:13,cursor:"pointer"}}>Enviar</button>
                <button type="button" onClick={()=>setModal(null)} style={{flex:1,padding:11,background:"#f5f5f5",color:"#555",border:"none",borderRadius:10,fontSize:13,cursor:"pointer"}}>Cancelar</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* ══════ MODAL CRÉDITOS ══════ */}
      {modal==="creditos" && (
        <div onClick={()=>setModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:20}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,padding:20,width:"100%",maxWidth:380}}>
            <div style={{textAlign:"center",marginBottom:20}}>
              <div style={{fontSize:28,fontWeight:700,color:GREEN,marginBottom:4}}>NUTRIPEAK</div>
              <div style={{fontSize:12,color:"#888"}}>Control Nutricional Inteligente v2.0</div>
            </div>

            <div style={{background:"#f9f9f9",borderRadius:12,padding:14,marginBottom:16,fontSize:13,lineHeight:1.6}}>
              <div style={{fontWeight:700,color:"#333",marginBottom:8}}>📝 Desarrollado por</div>
              <div style={{color:"#666",marginBottom:12}}>
                <strong>Leonardo Rebolledo</strong><br/>
                CEO - RECAST
              </div>

              <div style={{fontWeight:700,color:"#333",marginBottom:8}}>🔬 Modelos científicos</div>
              <div style={{color:"#666",marginBottom:12,fontSize:12}}>
                Basado en:<br/>
                • Mifflin-St Jeor (TMB)<br/>
                • Composición corporal (macros dinámicos)<br/>
                • Defintección de mesetas<br/>
                • Predicción de resultados
              </div>

              <div style={{fontWeight:700,color:"#333",marginBottom:8}}>📍 Ubicación</div>
              <div style={{color:"#666",marginBottom:12}}>
                Antofagasta, Chile
              </div>

              <div style={{fontWeight:700,color:"#333",marginBottom:8}}>📅 Versión</div>
              <div style={{color:"#666"}}>
                v2.0 - 2026
              </div>
            </div>

            <div style={{fontSize:11,color:"#aaa",textAlign:"center",marginBottom:14,lineHeight:1.5}}>
              NUTRIPEAK es una herramienta inteligente de control nutricional basada en métodos científicos probados para ayudarte a alcanzar tus objetivos de salud y fitness.
            </div>

            <button onClick={()=>setModal(null)} style={{width:"100%",padding:11,background:GREEN,color:"#fff",border:"none",borderRadius:10,fontWeight:700,fontSize:13,cursor:"pointer"}}>Cerrar</button>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
